<title>Línea base del STR</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Explorador en tres niveles (sistema › módulo › caso de uso) con migas de pan; el diagrama cambia con el nivel. */
:root{
  --papel:#f4f6f3; --hoja:#ffffff; --tinta:#1d2a2a; --tenue:#5d6b69; --linea:#d7deda; --acento:#0f6e6a; --acentof:#e2f0ee;
  --ok:#2f8a4e; --sinp:#c9a227; --inc:#c2412d; --noc:#8a96a3; --fuera:#d9dfdc; --sombra:rgba(20,40,40,.14); --entra:#c76a12;
  --f-tit:"Archivo","Arial Narrow",system-ui,sans-serif; --f-txt:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --f-dat:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --papel:#121a1a; --hoja:#1a2424; --tinta:#e3ebe8; --tenue:#9aaaa6; --linea:#2c3a39; --acento:#4fb3ad; --acentof:#1c3533;
  --ok:#5cc07a; --sinp:#e0bd4a; --inc:#ef7a64; --noc:#8e9aa6; --fuera:#2a3433; --sombra:rgba(0,0,0,.5); --entra:#f0a050; color-scheme:dark}}
:root[data-theme="dark"]{
  --papel:#121a1a; --hoja:#1a2424; --tinta:#e3ebe8; --tenue:#9aaaa6; --linea:#2c3a39; --acento:#4fb3ad; --acentof:#1c3533;
  --ok:#5cc07a; --sinp:#e0bd4a; --inc:#ef7a64; --noc:#8e9aa6; --fuera:#2a3433; --sombra:rgba(0,0,0,.5); --entra:#f0a050; color-scheme:dark}
body{background:var(--papel);color:var(--tinta);font:15px/1.5 var(--f-txt)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--papel)}
.envoltura{max-width:1200px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:24px}
h1,h2,h3{font-family:var(--f-tit);font-stretch:85%;text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.8rem;font-weight:800} h2{font-size:1.2rem;font-weight:700} h3{font-size:1rem;font-weight:700}
.etq{font:600 .7rem/1.2 var(--f-dat);letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.dat{font-family:var(--f-dat);font-variant-numeric:tabular-nums}
.tenue{color:var(--tenue)} .vacio{color:var(--tenue);font-style:italic}
a{color:var(--acento)}
.barraSup{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--papel);border-bottom:2px solid var(--tinta);padding-block:12px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.migas{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.95rem;min-width:0}
.migas a{text-decoration:none;font-weight:600} .migas .sep{color:var(--tenue)}
.busca{position:relative}
select,input[type=search]{font:inherit;color:var(--tinta);background:var(--hoja);border:1px solid var(--linea);border-radius:6px;padding:6px 10px;max-width:100%}
input[type=search]{width:min(320px,80vw)}
.sugerencias{position:absolute;top:100%;right:0;width:min(460px,90vw);background:var(--hoja);border:1px solid var(--linea);border-radius:8px;box-shadow:0 8px 24px var(--sombra);max-height:60vh;overflow:auto;z-index:6}
.sugerencias button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tinta);font:inherit;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--linea)}
.sugerencias button:hover,.sugerencias button:focus-visible{background:var(--acentof)}
:focus-visible{outline:2px solid var(--acento);outline-offset:2px}
.cab{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between;padding-top:8px}
.cab .izq{display:grid;gap:6px;min-width:0;max-width:72ch}
.cifras{display:flex;gap:28px;flex-wrap:wrap}
.cifra{display:grid;gap:2px} .cifra b{font:800 2.3rem/1 var(--f-tit);font-stretch:80%}
.barra{display:flex;height:12px;border-radius:3px;overflow:hidden;background:var(--fuera)} .barra span{display:block;height:100%}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem}
.leyenda i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.e-comprobado{background:var(--ok)} .e-parcial{background:var(--ok);opacity:.6} .e-sin-prueba{background:var(--sinp)} .e-con-prueba-sin-resultado{background:var(--sinp);opacity:.55}
.e-con-incidente{background:var(--inc)} .e-no-construido{background:transparent;box-shadow:inset 0 0 0 2px var(--noc)} .e-fuera-de-alcance{background:var(--fuera)}
.sec{display:grid;gap:12px}
.sec>.fila{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.mods,.calor{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.mod{background:var(--hoja);border:1px solid var(--linea);border-radius:8px;padding:14px;display:grid;gap:8px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.mod:hover{border-color:var(--acento)} .mod.fantasma{cursor:default;opacity:.7;border-style:dashed}
.fila2{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chip{font:600 .68rem/1 var(--f-dat);letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border-radius:4px;border:1px solid var(--linea);color:var(--tenue);white-space:nowrap}
.cap{background:var(--hoja);border:1px solid var(--linea);border-radius:8px;padding:12px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.teselas{display:flex;flex-wrap:wrap;gap:5px}
.tesela{width:22px;height:22px;border-radius:4px;cursor:pointer;border:0;padding:0}
.tesela:hover{transform:scale(1.15)} @media (prefers-reduced-motion:reduce){.tesela:hover{transform:none}}
.pct{font:700 .9rem/1 var(--f-dat);white-space:nowrap}
.diagrama{background:var(--hoja);border:1px solid var(--linea);border-radius:8px;overflow-x:auto}
.relpanel{margin-top:10px;background:var(--hoja);border:1px solid var(--linea);border-radius:8px;padding:12px 14px}
.relpanel h3{margin:0 0 6px;font-size:1rem} .relpanel .grupo{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.relpanel ul{list-style:none;margin:0;padding:0} .relpanel li{padding:6px 0;border-top:1px solid var(--linea)} .relpanel li:first-child{border-top:0}
.relpanel .dir{font:700 .72rem/1 var(--f-dat);letter-spacing:.06em;text-transform:uppercase;margin:4px 0 4px}
.relpanel .dir.sale{color:var(--acento)} .relpanel .dir.entra{color:var(--entra)}
.relpanel .mec{display:block;font-size:.8rem;color:var(--tenue);overflow-wrap:anywhere}
.pestanas{display:flex;gap:6px;flex-wrap:wrap}
.pestanas button{font:600 .85rem/1 var(--f-txt);padding:7px 12px;border-radius:6px;border:1px solid var(--linea);background:var(--hoja);color:var(--tinta);cursor:pointer}
.pestanas button[aria-selected="true"]{background:var(--acento);border-color:var(--acento);color:var(--hoja)}
.diagrama .capa{font:600 .72rem/1 var(--f-dat);letter-spacing:.06em;text-transform:uppercase;fill:var(--tenue)}
.diagrama .arista{stroke:var(--tenue);stroke-opacity:.28;transition:stroke-opacity .15s}
.diagrama .cuenta{font:600 11px var(--f-dat);fill:var(--tinta);opacity:0}
#svgCapas.foco .arista{stroke-opacity:.06}
#svgCapas.foco .arista.sale{stroke:var(--acento);stroke-opacity:.95} #svgCapas.foco .arista.entra{stroke:var(--entra);stroke-opacity:.95}
#svgCapas.foco .cuenta.sale,#svgCapas.foco .cuenta.entra{opacity:1}
.diagrama .nodo{cursor:pointer;transition:opacity .15s} .diagrama .nodo.apagado{opacity:.25}
.diagrama .nodo:hover rect:first-child,.diagrama .nodo:focus rect:first-child{stroke-width:2.5}
@media (prefers-reduced-motion:reduce){.diagrama .arista,.diagrama .nodo{transition:none}}
table.matriz{border-collapse:collapse;font:12px var(--f-dat);margin:8px}
table.matriz th,table.matriz td{border:1px solid var(--linea);padding:0;width:30px;height:28px;text-align:center;position:static}
table.matriz td{background:color-mix(in srgb,var(--acento) calc(var(--a,0)*100%),transparent);color:var(--tinta)}
table.matriz td[style]{font-weight:600}
table.matriz td.diag{background:var(--fuera)} table.matriz td.tot,table.matriz th.tot{background:var(--papel);font-weight:700}
table.matriz th.fil{text-align:left;padding:0 8px;white-space:nowrap;width:auto;font-weight:700;background:var(--hoja);position:sticky;left:0;z-index:1}
table.matriz th.col{height:auto;padding:6px 0;vertical-align:bottom;background:var(--hoja)}
table.matriz th.col span{writing-mode:vertical-rl;transform:rotate(180deg);font-weight:700}
table.matriz th.esq{font:600 .65rem/1.2 var(--f-dat);color:var(--tenue);text-align:left;padding:4px 8px;background:var(--hoja);position:sticky;left:0;z-index:2}
table.matriz .corte{border-left:2px solid var(--tinta)} table.matriz tr.corte>*{border-top:2px solid var(--tinta)}
.diagrama svg{display:block;width:100%;height:auto}
.diagrama text{fill:var(--tinta);font-family:var(--f-txt);font-size:12px}
.diagrama .t2{fill:var(--tenue);font-size:11px;font-family:var(--f-dat)}
.diagrama .nodo{cursor:pointer} .diagrama .nodo:hover rect{stroke:var(--acento);stroke-width:2}
.filtros{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tabla{background:var(--hoja);border:1px solid var(--linea);border-radius:8px;overflow:auto;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font:600 .7rem/1.2 var(--f-dat);letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);background:var(--papel);position:sticky;top:0}
tbody tr{cursor:pointer} tbody tr:hover{background:var(--acentof)}
td.dat,td.est{white-space:nowrap}
.punto{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.alcance,.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.caja{background:var(--hoja);border:1px solid var(--linea);border-radius:8px;padding:12px 14px;min-width:0}
.caja ul{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
dl.datos{display:grid;grid-template-columns:8em minmax(0,1fr);gap:8px 12px;margin:8px 0 0;font-size:.92rem}
dl.datos dt{color:var(--tenue);font-size:.82rem} dl.datos dd{margin:0;min-width:0;overflow-wrap:anywhere}
.esc{border:1px solid var(--linea);border-radius:6px;padding:10px 12px;display:grid;gap:4px;font-size:.92rem;background:var(--hoja)}
.esc .k{font:600 .72rem/1 var(--f-dat);color:var(--tenue);letter-spacing:.04em}
.enl{color:var(--acento);cursor:pointer;text-decoration:underline;text-underline-offset:2px;background:none;border:0;padding:0;font:inherit;text-align:left}
.avisos{font-size:.85rem;color:var(--tenue);columns:2 320px;margin:0;padding-left:18px}
</style>

<div class="envoltura">
  <div class="barraSup">
    <nav class="migas" id="migas" aria-label="Ubicación"></nav>
    <div class="busca">
      <input type="search" id="buscar" placeholder="Buscar caso de uso, INC, REQ…" aria-label="Buscar en toda la línea base" autocomplete="off">
      <div class="sugerencias" id="sug" hidden></div>
    </div>
  </div>
  <main id="vista" class="sec" style="gap:24px"></main>
</div>

<script>
const D = /*__DATOS__*/null;
const ESTADOS = [['comprobado','Comprobado por prueba'],['parcial','Parcial, con prueba'],['con-incidente','Con incidente'],['sin-prueba','Construido sin prueba'],
  ['con-prueba-sin-resultado','Con prueba sin resultado'],['no-construido','No construido'],['fuera-de-alcance','Fuera de alcance']];
const NOMBRE_EST = Object.fromEntries(ESTADOS);
const COLOR_EST = {'comprobado':'var(--ok)','parcial':'var(--ok)','con-incidente':'var(--inc)','sin-prueba':'var(--sinp)','con-prueba-sin-resultado':'var(--sinp)','no-construido':'var(--noc)','fuera-de-alcance':'var(--fuera)'};
const TIPOS = {operativa:'Operativa',control:'Control',datos:'Datos',integracion:'Integración',consulta:'Consulta'};
const $ = (s) => document.querySelector(s);
const $$ = (s) => document.querySelectorAll(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nMod = (m) => D.nombresModulo[m] || m;
const ACT = (a) => D.actores[a] || a;
const CU = {};
Object.entries(D.modulos).forEach(([m, x]) => x.archivo.casosUso.forEach((u) => { CU[u.id] = {mod: m, u}; }));
const est = (id) => { const c = CU[id]; return c ? D.modulos[c.mod].informe.estados[id] : null; };
const modDe = (id) => (String(id).match(/^CU-([A-Z0-9]+)-/) || [])[1];
const fmtPct = (v) => v == null ? '–' : v.toLocaleString('es-CO') + ' %';
const corta = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };

function ir(dest){ if (decodeURIComponent(location.hash.slice(1)) !== dest) location.hash = dest; else pintar(); }
window.addEventListener('hashchange', pintar);
function migas(partes){
  $('#migas').innerHTML = partes.map((p, i) => i < partes.length - 1 ? `<a href="#${p[0]}">${esc(p[1])}</a><span class="sep">›</span>` : `<span>${esc(p[1])}</span>`).join('');
}
function barra(porEstado, conLeyenda){
  const tot = Object.values(porEstado).reduce((a, b) => a + b, 0) || 1;
  const vis = ESTADOS.filter(([e]) => porEstado[e]);
  return `<div class="barra" role="img" aria-label="${vis.map(([e, n]) => n + ' ' + porEstado[e]).join(', ')}">${vis.map(([e, n]) => `<span class="e-${e}" style="width:${100 * porEstado[e] / tot}%" title="${esc(n)}: ${porEstado[e]}"></span>`).join('')}</div>`
   + (conLeyenda ? `<div class="leyenda">${vis.map(([e, n]) => `<span><i class="e-${e}"></i>${esc(n)} <b class="dat">${porEstado[e]}</b></span>`).join('')}</div>` : '');
}
function pintar(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (CU[h]) vistaCU(h); else if (D.modulos[h]) vistaModulo(h); else vistaSistema();
}

/* ---------- Sistema ---------- */
function vistaSistema(){
  migas([['sistema','STR · sistema']]);
  const mods = Object.keys(D.modulos);
  const tot = {}; let alc = 0, falt = 0, ncu = 0;
  mods.forEach((m) => { const I = D.modulos[m].informe; Object.entries(I.porEstado).forEach(([e, n]) => tot[e] = (tot[e] || 0) + n); alc += I.cobertura.alcance; falt += I.cobertura.faltan; ncu += I.casosUso; });
  const pend = Object.keys(D.nombresModulo).filter((m) => !D.modulos[m]);
  $('#vista').innerHTML = `
   <header class="cab"><div class="izq"><span class="etq">Línea base funcional · MJ-16</span><h1>STR Manager</h1>
     <span class="tenue">${mods.length} de ${Object.keys(D.nombresModulo).length} módulos levantados · ${ncu} casos de uso · resultados de ${esc(D.resultados || 'ninguna corrida')} · página ${esc(D.generado)}</span></div>
     <div class="cifras"><div class="cifra"><span class="etq">Cobertura de lo levantado</span><b class="dat">${fmtPct(alc ? Math.round(1000 * (1 - falt / alc)) / 10 : null)}</b><span class="tenue">${alc - falt} de ${alc} comprobados</span></div></div></header>
   <section class="sec">${barra(tot, true)}</section>
   ${seccionAlcance(mods)}
   <section class="sec"><div class="fila"><h2>Módulos</h2><span class="tenue">Toca un módulo para ver sus capacidades y casos de uso.</span></div>
     <div class="mods">${mods.map((m) => { const I = D.modulos[m].informe, A = D.modulos[m].archivo;
       return `<button class="mod" data-m="${m}"><div class="fila2"><span class="etq">${m}</span><span class="chip">${esc(A.estadoArchivo)}</span></div>
         <h3>${esc(nMod(m))}</h3><div class="fila2"><span class="tenue">${I.capacidades} capacidades · ${I.casosUso} casos de uso</span><b class="pct">${fmtPct(I.cobertura.simple)}</b></div>${barra(I.porEstado, false)}</button>`; }).join('')}
       ${pend.map((m) => `<div class="mod fantasma"><div class="fila2"><span class="etq">${m}</span><span class="chip">por levantar</span></div><h3>${esc(nMod(m))}</h3></div>`).join('')}</div></section>
   <section class="sec"><div class="fila"><h2>Cómo se conectan</h2>
       <div class="pestanas" role="tablist"><button role="tab" data-dg="capas" aria-selected="${VISTA_DG === 'capas'}">Mapa por capas</button><button role="tab" data-dg="matriz" aria-selected="${VISTA_DG === 'matriz'}">Matriz de dependencias</button></div></div>
     <div class="filtros"><label class="etq" for="fRel">Tipo de relación</label><select id="fRel">${opcionesRel()}</select><span class="tenue" id="fRelDesc"></span></div>
     <span class="tenue" id="dgAyuda"></span>
     <div class="diagrama" id="dg"></div>
     <div class="relpanel" id="dgRel" aria-live="polite"></div></section>`;
  $$('.mod[data-m], tr[data-m]').forEach((b) => b.onclick = () => ir(b.dataset.m));
  $$('[data-cu]').forEach((b) => b.onclick = () => ir(b.dataset.cu));
  $$('[data-dg]').forEach((b) => b.onclick = () => { VISTA_DG = b.dataset.dg; try { localStorage.setItem('lb-vista-dg', VISTA_DG); } catch (e) {}
    $$('[data-dg]').forEach((x) => x.setAttribute('aria-selected', String(x.dataset.dg === VISTA_DG))); diagramaSistema(); });
  $('#fRel').onchange = (e) => { FILTRO_REL = e.target.value; try { localStorage.setItem('lb-filtro-rel', FILTRO_REL); } catch (x) {} diagramaSistema(); };
  diagramaSistema();
}
function seccionAlcance(mods){
  const S = D.sistema || {}, Al = S.alcance || {}, conf = Al.confirmacion || {};
  const filas = mods.map((m) => { const A = D.modulos[m].archivo, cus = A.casosUso;
    const peso = {}; A.capacidades.forEach((c) => peso[c.peso] = (peso[c.peso] || 0) + 1);
    const prod = cus.filter((u) => u.ambito !== 'fabrica');
    const r = {m, caps: A.capacidades.length, peso, fab: cus.length - prod.length,
      con: prod.filter((u) => u.declarado === 'construido' || u.declarado === 'parcial').length,
      por: prod.filter((u) => u.declarado === 'no-construido').length,
      fuera: prod.filter((u) => u.declarado === 'fuera-de-alcance').length};
    r.alc = r.con + r.por; return r; });
  const t = filas.reduce((a, r) => { ['caps','alc','con','por','fuera','fab'].forEach((k) => a[k] += r[k]); return a; }, {caps:0, alc:0, con:0, por:0, fuera:0, fab:0});
  const fuera = Object.values(CU).filter(({u}) => u.declarado === 'fuera-de-alcance' && u.ambito !== 'fabrica');
  const pw = (r) => ['esencial','necesaria','accesoria','por-confirmar'].filter((k) => r.peso[k]).map((k) => `${r.peso[k]} ${k}`).join(' · ');
  return `<section class="sec"><div class="fila"><h2>Alcance del sistema</h2><span class="chip">${esc(conf.estado === 'confirmado' ? 'confirmado por Carlos ' + (conf.fecha || '') : 'borrador · lo confirma Carlos con Diseño')}</span></div>
     <p class="tenue" style="margin:0">${esc(Al.que || '')}</p>
     <div class="alcance">${(D.objetivos || []).map((o) => `<div class="caja"><span class="etq">${esc(o.id)}</span><h3 style="margin:4px 0">${esc(o.nombre)}</h3><span class="tenue">${esc(o.descripcion)}</span></div>`).join('')}</div>
     <div class="tabla" style="max-height:none"><table><thead><tr><th>Módulo</th><th>Capacidades</th><th>En alcance</th><th>Construido</th><th>Por construir</th><th>Fuera</th><th>De fábrica</th></tr></thead><tbody>
       ${filas.map((r) => `<tr data-m="${r.m}"><td><b>${r.m}</b> · ${esc(nMod(r.m))}</td><td class="tenue">${r.caps}: ${esc(pw(r))}</td><td class="dat">${r.alc}</td><td class="dat">${r.con}</td><td class="dat">${r.por}</td><td class="dat">${r.fuera}</td><td class="dat">${r.fab}</td></tr>`).join('')}
       <tr><td><b>Total</b></td><td class="dat">${t.caps}</td><td class="dat"><b>${t.alc}</b></td><td class="dat">${t.con}</td><td class="dat">${t.por}</td><td class="dat">${t.fuera}</td><td class="dat">${t.fab}</td></tr></tbody></table></div>
     <div class="alcance">
       <div class="caja"><span class="etq">Decisiones del sistema</span><ul>${(Al.decisiones || []).map((x) => `<li>${esc(x)}</li>`).join('') || '<li class="tenue">Ninguna todavía.</li>'}</ul></div>

    otros[d] = otros[d] || {ent:0, sal:0, caps:new Set()}; otros[d][l === 'entradas' ? 'ent' : 'sal']++; otros[d].caps.add(u.capacidad); })));
  const om = Object.keys(otros), W = 980, H = Math.max(caps.length, acts.length, om.length) * 44 + 60;
  const y = (i, n) => 40 + i * ((H - 60) / Math.max(n, 1)) + 18;
  const ic = Object.fromEntries(caps.map((c, i) => [c.id, i]));
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Contexto del módulo ${m}" style="min-width:760px">`;
  s += `<text x="20" y="22" class="t2">ACTORES</text><text x="300" y="22" class="t2">CAPACIDADES DE ${m}</text><text x="${W - 230}" y="22" class="t2">OTROS MÓDULOS</text>`;
  s += `<rect x="290" y="30" width="400" height="${H - 40}" rx="8" fill="none" stroke="var(--acento)" stroke-width="1.5"/>`;
  acts.forEach((a, i) => caps.forEach((c) => { const n = A.casosUso.filter((u) => u.capacidad === c.id && u.actor.includes(a)).length;
    if (n) s += `<line x1="150" y1="${y(i, acts.length)}" x2="300" y2="${y(ic[c.id], caps.length)}" stroke="var(--tenue)" stroke-opacity=".45" stroke-width="${Math.min(1 + n * .6, 5)}"/>`; }));
  om.forEach((o, i) => otros[o].caps.forEach((cid) => { s += `<line x1="680" y1="${y(ic[cid], caps.length)}" x2="${W - 240}" y2="${y(i, om.length)}" stroke="var(--acento)" stroke-opacity=".55" stroke-width="1.4"/>`; }));
  acts.forEach((a, i) => { s += `<rect x="20" y="${y(i, acts.length) - 14}" width="130" height="28" rx="14" fill="var(--papel)" stroke="var(--linea)"/><text x="85" y="${y(i, acts.length) + 4}" text-anchor="middle">${esc(ACT(a))}</text>`; });
  caps.forEach((c, i) => { const cus = A.casosUso.filter((u) => u.capacidad === c.id), yy = y(i, caps.length);
    s += `<rect x="300" y="${yy - 15}" width="380" height="30" rx="5" fill="var(--hoja)" stroke="var(--linea)"/><text x="312" y="${yy + 4}">${esc(corta(c.nombre, 44))}</text>`;
    cus.forEach((u, k) => { s += `<rect x="${592 + (k % 12) * 7}" y="${yy - 9 + Math.floor(k / 12) * 7}" width="5" height="5" fill="${COLOR_EST[est(u.id)]}"/>`; }); });
  om.forEach((o, i) => { const l = !!D.modulos[o], yy = y(i, om.length);
    s += `<g class="${l ? 'nodo' : ''}" data-m="${o}"><rect x="${W - 240}" y="${yy - 15}" width="220" height="30" rx="5" fill="${l ? 'var(--acentof)' : 'var(--papel)'}" stroke="${l ? 'var(--acento)' : 'var(--noc)'}" ${l ? '' : 'stroke-dasharray="4 3"'}/>
      <text x="${W - 230}" y="${yy + 4}">${esc(o)} · ${esc(corta(nMod(o), 20))}</text><text x="${W - 26}" y="${yy + 4}" text-anchor="end" class="t2">↓${otros[o].ent} ↑${otros[o].sal}</text></g>`; });
  $('#dg').innerHTML = s + '</svg>';
  $$('#dg .nodo').forEach((g) => g.onclick = () => ir(g.dataset.m));
}

/* ---------- Caso de uso ---------- */
function vistaCU(id){
  const {mod: m, u} = CU[id], A = D.modulos[m].archivo, cap = A.capacidades.find((c) => c.id === u.capacidad), t = u.tecnica || {};
  migas([['sistema','STR · sistema'], [m, m + ' · ' + nMod(m)], [id, id]]);
  const hermanos = A.casosUso.filter((x) => x.capacidad === u.capacidad), i = hermanos.findIndex((x) => x.id === id);
  const enlCU = (x) => CU[x] ? `<button class="enl" data-ir="${x}">${x}</button>` : `<span class="dat">${esc(x)}</span>${D.modulos[modDe(x)] ? '' : ' <span class="tenue">(módulo por levantar)</span>'}`;
  const relTxt = (r) => r ? ` <span class="tenue" title="${esc(D.rel[r] || '')}">${r}</span>` : '';

  $('#vista').innerHTML = `
   <header class="cab"><div class="izq"><span class="etq">${id} · ${esc(cap ? cap.nombre : '')} · ${TIPOS[cap && cap.tipo] || ''} · ${esc(cap ? cap.peso : '')}</span><h1>${esc(u.que)}</h1>
     <span><span class="punto e-${est(id)}"></span><b>${esc(NOMBRE_EST[est(id)])}</b> <span class="tenue">· declarado ${esc(u.declarado)} · confianza ${esc(u.confianza || 'media')}${u.ambito === 'fabrica' ? ' · ámbito fábrica (no cuenta en la cobertura)' : ''}</span></span></div>
     <div class="filtros">${i > 0 ? `<button class="enl" data-ir="${hermanos[i - 1].id}">← ${hermanos[i - 1].id}</button>` : ''}<span class="tenue">${i + 1} de ${hermanos.length} en la capacidad</span>${i < hermanos.length - 1 ? `<button class="enl" data-ir="${hermanos[i + 1].id}">${hermanos[i + 1].id} →</button>` : ''}</div></header>
   <section class="sec"><div class="fila"><h2>Flujo</h2><span class="tenue">De dónde recibe y a quién entrega. Toca un caso de uso para seguir el recorrido.</span></div><div class="diagrama" id="dg"></div></section>
   <section class="ficha">
     <div class="caja"><span class="etq">Información</span><dl class="datos">
       <dt>Actor</dt><dd>${u.actor.map((a) => esc(ACT(a))).join(', ')}</dd>
       <dt>Limitantes</dt><dd>${(u.limitantes || []).map(esc).join('<br>') || nada}</dd>
       <dt>Origen</dt><dd>${(u.origen || []).map(esc).join(', ') || nada}</dd>
       <dt>Reglas</dt><dd>${(u.reglas || []).map((r) => `${r} <span class="tenue">${esc(D.rt[r] || '')}</span>`).join('<br>') || nada}</dd>
       <dt>Pendientes</dt><dd>${(u.pendientes || []).map((p) => { const x = D.incs[p]; return `<span class="dat">${p}</span>${x ? ` <span class="tenue">(${esc(x.e)})</span> ${esc(corta(x.t, 120))}` : ''}`; }).join('<br>') || nada}</dd>
       <dt>Verificado</dt><dd>${u.verificado ? esc([u.verificado.fecha, u.verificado.como].filter(Boolean).join(' · ')) : nada}</dd>
     </dl></div>
     <div class="caja"><span class="etq">Relaciones y pruebas</span><dl class="datos">
       <dt>Recibe de</dt><dd>${(u.entradas || []).map((f) => `${enlCU(f.de)} · ${esc(f.dato)}${relTxt(f.rel)}`).join('<br>') || nada}</dd>
       <dt>Entrega a</dt><dd>${(u.salidas || []).map((f) => `${enlCU(f.a)} · ${esc(f.dato)}${relTxt(f.rel)}`).join('<br>') || nada}</dd>
       <dt>Relaciones</dt><dd>${[...new Set([].concat(u.entradas || [], u.salidas || []).map((f) => f.rel).filter(Boolean))].map((r) => `${r} <span class="tenue">${esc(D.rel[r] || '')}</span>`).join('<br>') || nada}</dd>
       <dt>Pruebas</dt><dd>${(u.pruebas || []).map((p) => `<span class="dat">${esc(p.guion)}</span>${p.casos && p.casos.length ? ' · casos ' + esc(p.casos.join(', ')) : ''}${p.fiable === false ? ` <span class="tenue">· no fiable: ${esc(p.nota || '')}</span>` : ''}`).join('<br>') || nada}</dd>
       <dt>Técnica</dt><dd class="tenue">${esc([].concat(t.paginas || [], t.rutas || [], t.colecciones || []).join(' · ')) || '—'}${t.notas ? '<br>' + esc(t.notas) : ''}</dd>
     </dl></div></section>

     ${(u.escenarios || []).map((e) => `<div class="esc"><span class="k">${esc(e.id)} · ${esc(e.tipo).toUpperCase()}</span><span><b>Dado</b> ${esc(e.dado)}</span><span><b>Cuando</b> ${esc(e.cuando)}</span><span><b>Entonces</b> ${esc(e.entonces)}</span></div>`).join('') || '<span class="vacio">Sin escenarios.</span>'}</section>`;
  $$('#vista [data-ir]').forEach((b) => b.onclick = () => ir(b.dataset.ir));
  diagramaCU(id);
  window.scrollTo({top:0});
}
function diagramaCU(id){
  const {u} = CU[id];
  const ent = u.entradas || [], sal = u.salidas || [];
  const n = Math.max(ent.length, sal.length, 1), W = 980, H = Math.max(n * 62 + 40, 170), cy = H / 2;
  const yi = (i, k) => k <= 1 ? cy : 30 + i * ((H - 60) / (k - 1));
  const caja = (x, yy, cid, dato) => { const c = CU[cid], l = !!c;
    return `<g class="${l ? 'nodo' : ''}" data-ir="${cid}"><rect x="${x}" y="${yy - 24}" width="300" height="48" rx="6" fill="var(--hoja)" stroke="${l ? 'var(--linea)' : 'var(--noc)'}" ${l ? '' : 'stroke-dasharray="4 3"'}/>
      ${l ? `<rect x="${x}" y="${yy - 24}" width="5" height="48" fill="${COLOR_EST[est(cid)]}"/>` : ''}<text x="${x + 14}" y="${yy - 6}" class="t2">${esc(cid)}${l ? '' : ' · por levantar'}</text><text x="${x + 14}" y="${yy + 11}">${esc(corta(l ? c.u.que : dato, 42))}</text><title>${esc((l ? c.u.que : '') + ' · ' + (dato || ''))}</title></g>`; };

  if (!sal.length) s += `<text x="${W - 170}" y="${cy + 4}" text-anchor="middle" class="t2">sin salidas a otros casos de uso</text>`;
  ent.forEach((f, i) => { const yy = yi(i, ent.length); s += `<path d="M320 ${yy} C 360 ${yy}, 360 ${cy}, 388 ${cy}" fill="none" stroke="var(--acento)" stroke-width="1.6" marker-end="url(#fa)"/><text x="350" y="${(yy + cy) / 2 - 4}" class="t2" text-anchor="middle">${esc(f.rel || '')}</text>` + caja(20, yy, f.de, f.dato); });
  sal.forEach((f, i) => { const yy = yi(i, sal.length); s += `<path d="M592 ${cy} C 620 ${cy}, 620 ${yy}, 658 ${yy}" fill="none" stroke="var(--acento)" stroke-width="1.6" marker-end="url(#fa)"/><text x="630" y="${(yy + cy) / 2 - 4}" class="t2" text-anchor="middle">${esc(f.rel || '')}</text>` + caja(660, yy, f.a, f.dato); });
  const q = String(u.que), l1 = q.slice(0, 28), l2 = corta(q.slice(28), 28);

    <text x="490" y="${cy + 4}" text-anchor="middle" style="font-weight:600">${esc(l1)}</text><text x="490" y="${cy + 20}" text-anchor="middle">${esc(l2)}</text>`;
  $('#dg').innerHTML = s + '</svg>';

}

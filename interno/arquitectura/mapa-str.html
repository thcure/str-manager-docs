/* Mapa del STR Manager · tablero de operación: cabecera fija, lienzo SVG con los módulos por bandas (quién lo usa → operación → transversal → interno y externos → infraestructura) y una ficha lateral que se abre al clic. */
:root{
  --bg:#eef1f3; --surface:#ffffff; --surface-2:#f7f9fa; --fg:#182230; --muted:#5b6b7a; --line:#d3dbe2; --line-strong:#a9b6c1;
  --accent:#0f766e; --accent-ink:#0b5a54; --accent-soft:#d9efec; --amber:#b45309;
  --ok:#2f8f5b; --warn:#c7861a; --crit:#c0392b; --ok-soft:#e1f2e8; --warn-soft:#fbeedb; --crit-soft:#f9e1de;
  --op:#1d4ed8; --tr:#0f766e; --in:#6b7280; --ac:#7c3aed; --ex:#b45309;
  --font-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --shadow:0 10px 30px rgba(24,34,48,.14);
}

  --bg:#0f1519; --surface:#171f26; --surface-2:#1d2730; --fg:#e6ebef; --muted:#93a1ad; --line:#2a3640; --line-strong:#3f4f5c;
  --accent:#2dd4bf; --accent-ink:#8ff0e3; --accent-soft:#123b38; --amber:#f0a44a;
  --ok:#4ade80; --warn:#f2b35a; --crit:#f87171; --ok-soft:#133224; --warn-soft:#3a2a12; --crit-soft:#3d1a18;
  --op:#7ea2ff; --tr:#2dd4bf; --in:#9aa5b1; --ac:#c4a5ff; --ex:#f0a44a; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1519; --surface:#171f26; --surface-2:#1d2730; --fg:#e6ebef; --muted:#93a1ad; --line:#2a3640; --line-strong:#3f4f5c;
  --accent:#2dd4bf; --accent-ink:#8ff0e3; --accent-soft:#123b38; --amber:#f0a44a;
  --ok:#4ade80; --warn:#f2b35a; --crit:#f87171; --ok-soft:#133224; --warn-soft:#3a2a12; --crit-soft:#3d1a18;
  --op:#7ea2ff; --tr:#2dd4bf; --in:#9aa5b1; --ac:#c4a5ff; --ex:#f0a44a; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-body);display:flex;flex-direction:column;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
.mono{font-family:var(--font-mono);font-size:.92em}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
h1{font:700 22px/1.1 var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font:500 12px/1.3 var(--font-body);color:var(--muted);letter-spacing:0;margin-top:2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.tabs button:focus-visible,.chip:focus-visible,.node:focus-visible,.drawer button:focus-visible,#buscar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.buscar{margin-left:auto;position:relative;flex:1 1 220px;max-width:380px;min-width:0}
#buscar{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface-2);color:var(--fg);font:inherit}
#sugerencias{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:320px;overflow:auto;z-index:20;margin-top:4px}
#sugerencias button{display:flex;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;cursor:pointer;align-items:baseline}
#sugerencias button:hover,#sugerencias button:focus{background:var(--surface-2)}
#sugerencias .t{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;min-width:72px}
main{flex:1;display:flex;min-height:0;position:relative}
.vista{flex:1;min-width:0;overflow:auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px;color:var(--muted);margin:0 0 8px}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.lienzo{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto}
svg.mapa{display:block;width:100%;min-width:900px;height:auto;font-family:var(--font-body);user-select:none}
.banda-l{font:700 11px var(--font-display);letter-spacing:.12em;text-transform:uppercase;fill:var(--muted)}
.banda-r{fill:var(--surface-2);stroke:var(--line)}
.node{cursor:pointer}
.node rect.caja{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.2;rx:8}
.node.parcial rect.caja{stroke-dasharray:6 3}
.node.definido rect.caja{stroke-dasharray:3 3;fill:var(--surface-2)}
.node.no-existe rect.caja{stroke-dasharray:1 3;fill:var(--surface-2);opacity:.75}
.node:hover rect.caja,.node.sel rect.caja{stroke:var(--accent);stroke-width:2}
.node.apagado{opacity:.22}
.node text{fill:var(--fg)}
.node .id{font:500 11px var(--font-mono);fill:var(--muted)}
.node .nom{font:600 12.5px var(--font-body)}
.node .dat{font:400 10px var(--font-mono);fill:var(--muted)}
.node .fam{font:500 9.5px var(--font-body);letter-spacing:.08em;text-transform:uppercase}
.actor rect.caja{rx:18}
.ec rect.caja{rx:4;fill:var(--surface-2)}
.ec .nom{font-size:10px;font-weight:500}
.edge{fill:none;stroke:var(--line-strong);stroke-width:1.4;cursor:pointer;transition:opacity .15s}
.edge.por{stroke-dasharray:5 4;stroke:var(--muted)}
.edge:hover,.edge.sel{stroke:var(--accent);stroke-width:2.6}
.edge.apagado{opacity:.07}
.edge-hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.flecha{fill:var(--line-strong)}
.riesgo-alto{fill:var(--crit)} .riesgo-medio{fill:var(--warn)} .riesgo-bajo{fill:var(--ok)}
.drawer{width:min(440px,100%);flex:0 0 auto;background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding-block:14px;padding-left:16px;padding-right:max(16px,env(safe-area-inset-right,0px));display:none}
.drawer.abierto{display:block}
.drawer .cerrar{float:right;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:4px 9px;cursor:pointer}
.drawer .tipo{font:500 11px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.drawer h2{font:700 20px/1.15 var(--font-display);margin:2px 0 6px;text-wrap:balance}
.drawer h3{font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px;border-top:1px solid var(--line);padding-top:10px}
.drawer p{margin:4px 0}
.drawer ul{margin:4px 0;padding-left:18px}
.drawer li{margin:2px 0}
.ref{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font:500 11.5px var(--font-mono);background:var(--surface-2);cursor:pointer;color:var(--fg);margin:1px 2px 1px 0;text-decoration:none}
.ref:hover{border-color:var(--accent);color:var(--accent-ink)}
.badge{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;vertical-align:1px}
.b-aceptado,.b-construido,.b-vigente{background:var(--ok-soft);color:var(--ok)}
.b-entregado,.b-parcial,.b-por{background:var(--warn-soft);color:var(--warn)}
.b-definido,.b-borrador,.b-no-existe,.b-descartado,.b-sin{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.b-alto{background:var(--crit-soft);color:var(--crit)} .b-medio{background:var(--warn-soft);color:var(--warn)} .b-bajo{background:var(--ok-soft);color:var(--ok)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.ruta{font:12px var(--font-mono);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:2px 6px;overflow-wrap:anywhere}
.copiar{border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:1px 7px;font-size:11px;cursor:pointer;margin-left:4px}
table.tabla{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
table.tabla th,table.tabla td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.tabla th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);position:sticky;top:0;background:var(--surface)}
table.tabla td.n{text-align:right}
table.tabla tr:hover td{background:var(--surface-2)}
.tabla-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.matriz td{text-align:center;font-family:var(--font-mono);font-size:12px}
.matriz td.si{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.resumen{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 10px}
.resumen div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:120px}
.resumen b{display:block;font:700 20px/1 var(--font-display)}
.resumen span{font-size:11px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.nota{font-size:12px;color:var(--muted)}
.barra{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:60px}
.barra i{display:block;height:100%;background:var(--accent)}
.caso{border-left:3px solid var(--line);padding:2px 8px;margin:4px 0;font-size:12.5px}
.caso .mono{color:var(--muted)}
@media (max-width:760px){
  main{flex-direction:column}
  .drawer{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:72%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));z-index:8}
  h1{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

// ruta.js — la ruta de pruebas de un lote, derivada del mapa del STR (LM-41, MJ-14/MJ-2). Funciones puras, sin red ni disco
// salvo la CLI del final. La misma implementación la usan mapa.py (--ruta y cobertura), la página mapa-str.html y pw
// (LM-39b: probar-lote.js la requiere para elegir la regresión).
//
//   ruta(mapa, guiones, lote) → { modulos[], porQue{}, relaciones[], reglas[], guionesCorren[], casosCorren[], noCorren[], huecos{relaciones[], reglas[]}, resumen }
//     lote = { archivos: [...], mapaLinea: 'HK, INV; REL-10', req: 'REQ-INV2-4-2', regresionLinea: 'ninguna|todas|<zonas o módulos>' }
//   cobertura(mapa, guiones) → { relaciones: {REL-n: [{guion, c}]}, reglas: {RT-n: [...]}, modulos: {HK: [...]} }
//   leerCabecera(texto) → lote (de la cabecera de una instrucción .md)
//
// Un caso cubre un nodo si lo declara en `cubre: ['REL-16', 'RT-8', 'HK', 'REQ-K3-2']` (LM-41). Sin `cubre`, el caso vale por los
// módulos del guion (anclaje por REQ o por página, mapa.py), que es la cobertura gruesa de hoy.
'use strict';

const ID_MOD = /^[A-Z][A-Z0-9]{0,4}$/;

function normaliza(s) { return String(s || '').trim(); }

// Módulos que toca un lote: archivos del Alcance (archivoModulo + páginas), línea «Mapa:» y REQ (anclajeReq).
function modulosDelLote(mapa, lote) {
  const ids = new Set(mapa.modulos.map((m) => m.id));
  const porQue = {};
  const add = (id, motivo) => { if (!ids.has(id)) return; (porQue[id] = porQue[id] || []).push(motivo); };
  const am = (mapa.anclajeGuiones && mapa.anclajeGuiones.archivoModulo && mapa.anclajeGuiones.archivoModulo.mapa) || {};
  const pm = (mapa.anclajeGuiones && mapa.anclajeGuiones.paginaModulo) || {};
  for (const a of lote.archivos || []) {
    const f = normaliza(a).replace(/\\/g, '/').replace(/^\.?\//, '');
    for (const [k, mods] of Object.entries(am)) {
      if (f === k || f.endsWith('/' + k) || (k.endsWith('/') && f.startsWith(k)) || f.startsWith(k + '/')) mods.forEach((m) => add(m, 'archivo ' + f));
      else if (f.endsWith('/') && k.startsWith(f)) mods.forEach((m) => add(m, 'carpeta ' + f + ' (incluye ' + k + ')'));   // «api/ entero»
    }
    const base = '/' + f.split('/').pop();
    if (pm[base]) add(pm[base], 'página ' + base);
    if (/^api\//.test(f) && !Object.keys(am).some((k) => f === k || f.startsWith(k))) add('SRV', 'archivo ' + f + ' (api/)');
    if (/^modelo\//.test(f)) add('MOD', 'archivo ' + f);
  }
  for (const tok of String(lote.mapaLinea || '').split(/[^A-Za-z0-9/-]+/)) {
    const t = tok.replace(/\//g, '');
    if (ID_MOD.test(t) && ids.has(t)) add(t, 'línea «Mapa:»');
  }
  const ancla = mapa.anclajeReq || {}, rm = (mapa.anclajeGuiones && mapa.anclajeGuiones.reqModulo) || {};
  for (const r of (lote.req || '').split(/[\s,;·]+/).filter(Boolean)) {
    for (const m of (rm[r] || ancla[r] || [])) add(m, 'REQ ' + r);
  }
  return porQue;
}

function relacionesDeRuta(mapa, modulos, mapaLinea) {
  const set = new Set(modulos), out = [];
  const pedidas = new Set((String(mapaLinea || '').match(/REL-\d+/g) || []));
  for (const r of mapa.relaciones || []) {
    if (r.estado && r.estado !== 'vigente' && !pedidas.has(r.id)) continue;
    const o = r.origen, d = r.destino;
    const toca = pedidas.has(r.id) || (o !== '*' && set.has(o)) || (d !== '*' && set.has(d)) || ((o === '*' || d === '*') && modulos.length);
    if (toca) out.push(r);
  }
  return out;
}

function reglasDeRuta(mapa, modulos) {
  const set = new Set(modulos);
  return (mapa.reglas || []).filter((g) => g.modulos.includes('*') || g.modulos.some((m) => set.has(m)));
}

// Qué cubre cada caso: lo declarado en `cubre`, o los módulos del guion.
function nodosDelCaso(g, c) {
  const n = new Set();
  for (const x of (c && c.cubre) || []) n.add(normaliza(x));
  if (!n.size) for (const m of g.modulos || []) n.add(m);
  return n;
}

function ruta(mapa, guiones, lote) {
  let porQue = modulosDelLote(mapa, lote);
  // Lote de solo guiones o herramientas (tests/, herramientas/, docs/): no toca el producto → su guion (si trae) + humo; sin huecos (M-522).
  // Cuenta como tal si todos sus archivos son de esas carpetas y ningún módulo viene de la línea «Mapa:» (el REQ no lo convierte en lote de producto).
  const archivos = (lote.archivos || []).map((a) => String(a).replace(/\\/g, '/'));
  const soloGuiones = archivos.length > 0 && archivos.every((a) => /^(tests\/|herramientas\/|docs\/|\.claude\/|CLAUDE\.md$)/.test(a)) && !Object.values(porQue).some((ms) => ms.some((x) => /Mapa:/.test(x)));
  if (soloGuiones) porQue = {};
  const modulos = Object.keys(porQue).sort();
  // Equivalencias de REQ (anclajeGuiones.reqEquivale: REQ-K3b ↔ REQ-K3-2, R-3 ↔ REQ-MOD-6) para que el guion del lote y `cubre` casen
  const equiv = (mapa.anclajeGuiones && mapa.anclajeGuiones.reqEquivale) || {};
  const reqsLote = new Set((lote.req || '').split(/[\s,;·]+/).filter(Boolean));
  for (const r of [...reqsLote]) { if (equiv[r]) reqsLote.add(equiv[r]); for (const [k, v] of Object.entries(equiv)) if (v === r) reqsLote.add(k); }
  const relaciones = relacionesDeRuta(mapa, modulos, lote.mapaLinea);
  const reglas = reglasDeRuta(mapa, modulos);
  const nodos = new Set([...modulos, ...relaciones.map((r) => r.id), ...reglas.map((r) => r.id)]);
  for (const r of reqsLote) nodos.add(r);
  const reg = normaliza(lote.regresionLinea).toLowerCase();
  const guionesCorren = [], casosCorren = [], noCorren = [];
  const cubierto = { relaciones: {}, reglas: {} };
  for (const g of guiones || []) {
    const casos = g.casos && g.casos.length ? g.casos : [{ c: '*', cubre: [] }];
    const corren = [];
    for (const c of casos) {
      const n = nodosDelCaso(g, c);
      const hit = [...n].filter((x) => nodos.has(x));
      const esPropio = g.req && reqsLote.has(g.req);
      const esHumo = /humo-pw/.test(g.archivo);
      if ((reg === 'ninguna' || soloGuiones) && !esPropio && !esHumo) continue;
      if (reg === 'todas' || esPropio || esHumo || hit.length) {
        corren.push({ c: c.c, por: esPropio ? ['guion del lote'] : (reg === 'todas' ? ['Regresión: todas'] : (hit.length ? hit : ['humo'])) });
        for (const x of hit) {
          if (/^REL-/.test(x)) (cubierto.relaciones[x] = cubierto.relaciones[x] || []).push(g.archivo + ' ' + (c.c || ''));
          if (/^RT-/.test(x)) (cubierto.reglas[x] = cubierto.reglas[x] || []).push(g.archivo + ' ' + (c.c || ''));
        }
      }
    }
    if (corren.length) { guionesCorren.push({ archivo: g.archivo, zona: g.zona, modulos: g.modulos, casos: corren.length, de: casos.length }); corren.forEach((x) => casosCorren.push({ guion: g.archivo, ...x })); }
    else noCorren.push({ archivo: g.archivo, porQue: 'ningún caso cubre un nodo de la ruta (' + (g.modulos || []).join(', ') + ')' });
  }
  // Huecos: relación (no genérica) por la que nadie pasa ni por módulos; regla de tipo 'caso' sin caso que la declare.
  // «A declarar»: algún guion de la ruta pasa por los dos módulos de la relación, pero ningún caso la declara en `cubre`.
  const modsCorren = new Set(guionesCorren.flatMap((g) => g.modulos || []));
  const pasaPorModulos = (r) => r.origen !== '*' && r.destino !== '*' && modsCorren.has(r.origen) && modsCorren.has(r.destino);
  const relNoGen = relaciones.filter((r) => !r.generica && r.origen !== '*' && r.destino !== '*');
  const huecos = {
    relaciones: relNoGen.filter((r) => !cubierto.relaciones[r.id] && !pasaPorModulos(r)).map((r) => ({ id: r.id, origen: r.origen, destino: r.destino, mecanismo: r.mecanismo })),
    reglas: reglas.filter((r) => r.prueba !== 'proceso' && !cubierto.reglas[r.id]).map((r) => ({ id: r.id, titulo: r.titulo })),
  };
  const aDeclarar = relNoGen.filter((r) => !cubierto.relaciones[r.id] && pasaPorModulos(r)).map((r) => r.id);
  const reglasFabrica = reglas.filter((r) => r.prueba === 'proceso').map((r) => r.id);
  if (soloGuiones) { huecos.relaciones = []; huecos.reglas = []; }
  return { modulos, porQue, relaciones, reglas, guionesCorren, casosCorren, noCorren, huecos, aDeclarar, reglasFabrica, soloGuiones,
    resumen: soloGuiones ? `lote de solo guiones o herramientas (no toca el producto): corre su guion y el humo; sin ruta ni huecos` : `${modulos.length} módulos · ${relaciones.length} relaciones · ${reglas.length} reglas · corren ${guionesCorren.length} guiones (${casosCorren.length} casos) · no corren ${noCorren.length} · huecos: ${huecos.relaciones.length} relaciones, ${huecos.reglas.length} reglas` };
}

// Cobertura global por nodo (para el mapa): solo lo declarado con `cubre`; por módulo cuenta también el anclaje del guion.
function cobertura(mapa, guiones) {
  const out = { relaciones: {}, reglas: {}, modulos: {}, casosSinCubre: 0, casos: 0 };
  for (const g of guiones || []) {
    for (const m of g.modulos || []) (out.modulos[m] = out.modulos[m] || []).push(g.archivo);
    for (const c of g.casos || []) {
      out.casos++;
      if (!c.cubre || !c.cubre.length) { out.casosSinCubre++; continue; }
      for (const x of c.cubre) {
        const k = /^REL-/.test(x) ? 'relaciones' : /^RT-/.test(x) ? 'reglas' : null;
        if (k) (out[k][x] = out[k][x] || []).push(g.archivo + ' ' + (c.c || ''));
      }
    }
  }
  return out;
}

// Cabecera de una instrucción (.md): Alcance, Mapa, Regresión, Requerimiento/REQ.
function leerCabecera(texto) {
  const lineas = String(texto || '').split(/\r?\n/).slice(0, 40);
  const linea = (re) => { const l = lineas.find((x) => re.test(x)); return l ? l.replace(re, '').trim() : ''; };
  // Alcance: solo lo que cambia (M-521). Se corta en «no toques / no tocar / sin tocar» y se descartan los tramos que solo
  // hablan de versión (`?v=`, STR_API_VERSION, schema_version: RT-20, de fábrica) o van marcados «salvo/solo `?v=`».
  let alcance = linea(/^Alcance:\s*/);
  alcance = alcance.split(/\b(?:no toques|no tocar|sin tocar|no cambies)\b/i)[0];
  const tramos = alcance.split(/\s[·;]\s|\s·|·\s/).filter((t) => !/\?v=|STR_API_VERSION|schema_version|migraci[oó]n/i.test(t));
  const archivos = [];
  for (const t of tramos) {
    for (const m of t.matchAll(/`?([A-Za-z0-9_./\\-]+\.(?:js|php|html|json|md|ps1|css|sql))`?/g)) archivos.push(m[1]);
    for (const m of t.matchAll(/(?:^|[`\s(])((?:api|modelo|tests|herramientas)\/(?:[A-Za-z0-9_./-]*\/)?)(?=[`\s·,;)]|$)/g)) archivos.push(m[1]);
  }
  // Líneas aparte, si el borrador las trae: «Cambia:» suma; «No toques:» y «Versión:» no cuentan.
  for (const m of (linea(/^Cambia:\s*/) || '').matchAll(/`?([A-Za-z0-9_./\\-]+\.(?:js|php|html|json|md|ps1|css|sql))`?/g)) archivos.push(m[1]);
  const titulo = (lineas.find((x) => /^#\s*instr/i.test(x)) || '');
  const reqs = [...new Set([...(titulo.match(/(?:REQ|INC|DT|R)-[A-Z0-9][A-Z0-9.-]*/g) || []), ...((linea(/^Origen:.*?Requerimiento:\s*/) || '').match(/REQ-[A-Z0-9][A-Z0-9.-]*/g) || [])])];
  return { archivos: [...new Set(archivos)], mapaLinea: linea(/^Mapa:[^:]*:\s*/) || linea(/^Mapa:\s*/), regresionLinea: linea(/^Regresi[oó]n:\s*/), req: reqs.join(' ') };
}

function markdown(r) {

  L.push(`- Módulos: ${r.modulos.map((m) => `**${m}** (${[...new Set(r.porQue[m])].join('; ')})`).join(' · ') || 'ninguno: revisa Alcance y «Mapa:»'}`);
  L.push(`- Relaciones por las que pasa: ${r.relaciones.map((x) => `${x.id} ${x.origen}→${x.destino}`).join(', ') || '—'}`);

  L.push(`- Corren (regresión por ruta): ${r.guionesCorren.map((g) => `${g.archivo.replace('.spec.js', '')} (${g.casos}/${g.de})`).join(', ') || '—'}`);

  L.push(`- A declarar (algún guion pasa por sus módulos, ningún caso lo dice en \`cubre\`): ${r.aDeclarar.join(', ') || 'ninguna'}`);

}

const REPO_DOCS = 'https://github.com/thcure/str-manager-docs/blob/main/';

const MOD = Object.fromEntries(D.modulos.map((m) => [m.id, m]));

// ---------- posiciones del mapa (bandas) ----------
const W = 1240, NW = 150, NH = 70, GX = 20;
const BANDAS = [
  {y: 36, h: 70, titulo: 'Quién lo usa', items: ['admin', 'operador', 'colaborador', 'invitado', 'huesped', 'propietario', 'porteria'], tipo: 'actor'},
  {y: 136, h: 96, titulo: 'Operación', items: ['U', 'PR', 'CAL', 'FL', 'KN', 'INV'], tipo: 'mod'},
  {y: 252, h: 96, titulo: '', items: ['HK', 'POR', 'INC1', 'PG', 'M2', 'CMP', 'M6'], tipo: 'mod'},
  {y: 370, h: 96, titulo: 'Transversal', items: ['SH', 'API', 'SRV', 'K3'], tipo: 'mod'},
  {y: 488, h: 96, titulo: 'Interno · externos', items: ['PRJ', 'MOD', 'google-drive', 'airbnb', 'github', 'cron', 'cola-arquitecto'], tipo: 'mixto'},
  {y: 606, h: 150, titulo: 'Infraestructura', items: D.infraestructura.map((e) => e.id), tipo: 'ec'},
];
const POS = {};
for (const b of BANDAS) {
  if (b.tipo === 'ec') {
    const cols = 6, w = (W - 60 - GX * (cols - 1)) / cols, h = 34;
    b.items.forEach((id, i) => { const c = i % cols, r = Math.floor(i / cols); POS[id] = {x: 50 + c * (w + GX), y: b.y + 24 + r * (h + 8), w, h, tipo: 'ec'}; });
    continue;
  }
  const n = b.items.length, w = b.tipo === 'actor' ? 136 : NW, h = b.tipo === 'actor' ? 40 : NH;
  const total = n * w + (n - 1) * GX, x0 = 50 + (W - 60 - total) / 2;
  b.items.forEach((id, i) => { POS[id] = {x: x0 + i * (w + GX), y: b.y + (b.h - h) / 2 + 6, w, h, tipo: MOD[id] ? 'mod' : 'actor'}; });
}
const H = 606 + 150 + 16;

function centro(id) { const p = POS[id]; return p ? {x: p.x + p.w / 2, y: p.y + p.h / 2, p} : null; }
function curva(a, b) {
  const A = centro(a), B = centro(b); if (!A || !B) return null;
  const abajo = B.y > A.y;
  const y1 = abajo ? A.p.y + A.p.h : A.p.y, y2 = abajo ? B.p.y : B.p.y + B.p.h;
  if (Math.abs(A.y - B.y) < 10) { const y = A.p.y + A.p.h; return `M${A.x},${y} C${A.x},${y + 40} ${B.x},${y + 40} ${B.x},${y}`; }
  const dy = (y2 - y1) / 2;
  return `M${A.x},${y1} C${A.x},${y1 + dy} ${B.x},${y2 - dy} ${B.x},${y2}`;
}

// ---------- estado ----------
let vista = 'mapa', sel = null, filtroFam = new Set(['operativo', 'transversal', 'interno']), verEdges = true;

function render() {
  const v = $('#vista');
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.v === vista)));
  if (vista === 'mapa') v.innerHTML = htmlMapa();
  else if (vista === 'cobertura') v.innerHTML = htmlCobertura();
  else if (vista === 'reglas') v.innerHTML = htmlReglas();
  else if (vista === 'relaciones') v.innerHTML = htmlRelaciones();
  else if (vista === 'ruta') v.innerHTML = htmlRuta();
  else v.innerHTML = htmlGuiones();
  if (vista === 'mapa') montarMapa();

}

// ---------- vista Mapa ----------
function htmlMapa() {

  return `<div class="leyenda">

  </div>
  <div class="lienzo"><svg class="mapa" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa de módulos del STR">
    <defs><marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="flecha"/></marker></defs>
    ${BANDAS.map((b) => `<rect class="banda-r" x="8" y="${b.y}" width="${W - 16}" height="${b.h}" rx="10"/>${b.titulo ? `<text class="banda-l" x="22" y="${b.y + 16}">${b.titulo}</text>` : ''}`).join('')}
    <g id="edges">${D.relaciones.filter((r) => r.origen !== '*' && r.destino !== '*').map((r) => { const d = curva(r.origen, r.destino); return d ? `<g data-rel="${r.id}"><path class="edge-hit" d="${d}"/><path class="edge ${r.estado !== 'vigente' ? 'por' : ''}" d="${d}" marker-end="url(#f)"><title>${esc(r.id)} · ${esc(r.origen)} → ${esc(r.destino)}: ${esc(r.mecanismo)}</title></path></g>` : ''; }).join('')}</g>

  <p class="nota">Clic en un módulo, actor, relación (línea) o elemento de infraestructura para abrir su ficha. Enlace directo: añade <span class="mono">#HK</span>, <span class="mono">#REL-05</span>, <span class="mono">#RT-8</span> o <span class="mono">#REQ-INV2-4-2</span> a la dirección.</p>`;
}
function svgNodo(id) {
  const p = POS[id];
  if (p.tipo === 'ec') { const e = EC[id]; return `<g class="node ec" data-id="${id}" tabindex="0" role="button" transform="translate(${p.x},${p.y})"><rect class="caja" width="${p.w}" height="${p.h}"/><text class="id" x="8" y="14">${esc(e.id)}</text><text class="nom" x="8" y="27">${esc(recortar(e.nombre, 34))}</text><title>${esc(e.nombre)}</title></g>`; }

  const m = MOD[id], c = COB[id] || {}, fam = FAM[m.familia];
  const reqTxt = c.reqVigentes ? `REQ ${c.reqAceptados}/${c.reqVigentes}` : `REQ hist. ${c.reqHistoricos || 0}`;
  return `<g class="node mod ${m.estado} fam-${m.familia}" data-id="${id}" tabindex="0" role="button" transform="translate(${p.x},${p.y})">

function recortar(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function montarMapa() {
  const svg = $('svg.mapa');
  svg.addEventListener('click', (e) => {
    const n = e.target.closest('.node'); if (n) return abrir(n.dataset.id);
    const g = e.target.closest('[data-rel]'); if (g) return abrir(g.dataset.rel);
  });
  svg.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { const n = e.target.closest('.node'); if (n) { e.preventDefault(); abrir(n.dataset.id); } } });
  document.querySelectorAll('.chip[data-fam]').forEach((b) => b.addEventListener('click', () => { const k = b.dataset.fam; filtroFam.has(k) ? filtroFam.delete(k) : filtroFam.add(k); render(); }));
  $('#chipEdges').addEventListener('click', () => { verEdges = !verEdges; render(); });
  aplicarResalte();
}
function aplicarResalte() {
  const svg = $('svg.mapa'); if (!svg) return;
  const nodos = svg.querySelectorAll('.node'), edges = svg.querySelectorAll('[data-rel]');
  let vecinos = null, relSel = null;
  if (sel && MOD[sel]) { vecinos = new Set([sel]); for (const r of D.relaciones) { if (r.origen === sel && r.destino !== '*') vecinos.add(r.destino); if (r.destino === sel && r.origen !== '*') vecinos.add(r.origen); } }
  if (sel && ACT[sel]) { vecinos = new Set([sel]); for (const r of D.relaciones) { if (r.origen === sel) vecinos.add(r.destino); if (r.destino === sel) vecinos.add(r.origen); } for (const m of D.modulos) if ((m.actores || []).includes(sel)) vecinos.add(m.id); }
  if (sel && EC[sel]) { vecinos = new Set([sel]); for (const m of EC[sel].modulos) if (m === '*') D.modulos.forEach((x) => vecinos.add(x.id)); else vecinos.add(m); }
  if (sel && REL[sel]) { relSel = REL[sel]; vecinos = new Set([relSel.origen, relSel.destino, sel]); }
  nodos.forEach((n) => {
    const id = n.dataset.id, m = MOD[id];
    const famOk = !m || filtroFam.has(m.familia);
    n.classList.toggle('apagado', !famOk || (vecinos && !vecinos.has(id)));
    n.classList.toggle('sel', id === sel);
  });
  edges.forEach((g) => {
    const r = REL[g.dataset.rel];
    const famOk = (!MOD[r.origen] || filtroFam.has(MOD[r.origen].familia)) && (!MOD[r.destino] || filtroFam.has(MOD[r.destino].familia));
    const toca = !vecinos || (relSel ? r.id === sel : (vecinos.has(r.origen) && vecinos.has(r.destino) && (r.origen === sel || r.destino === sel || ACT[sel] || EC[sel])));
    g.style.display = verEdges && famOk ? '' : 'none';
    g.querySelector('.edge').classList.toggle('apagado', !toca);
    g.querySelector('.edge').classList.toggle('sel', r.id === sel);
  });
}

  return `<span class="ruta">${esc(p)}</span><button class="copiar" data-copiar="${esc(p)}">copiar</button> <span class="nota">(proyecto «Diseño y Desarrollo»)</span>`;

  <p><span class="badge b-${r.estado}">${esc(r.estado)}</span> ${r.prioridad != null ? `<span class="badge b-sin">prioridad ${r.prioridad}</span>` : ''}</p>
  <dl class="kv"><dt>Módulos</dt><dd>${r.modulos.map((m) => nodoRef(m)).join(' ') || '—'}</dd><dt>DA</dt><dd>${(r.das || []).join(', ') || '—'}</dd><dt>Nota</dt><dd>${esc(r.nota || '—')}</dd></dl>
  <h3>Lotes</h3>${lista(cambios, (c) => `<span class="mono">${esc(c.lote)}</span> <span class="nota">${esc(c.fecha)}</span> ${esc(c.resumen)}`)}
  <h3>Guiones (${gs.length})</h3>${lista(gs, (g) => `${refId(g.archivo.replace('.spec.js', ''))} <span class="nota">${g.nCasos} casos</span>`)}
  <h3>Documento</h3><p>${r.documento ? r.documento.split(/;|›/).map((p) => rutaDoc(p.trim().split(' ')[0])).join(' ') : '—'}</p>`;
}
function fichaGuion(g) {
  return `<div class="tipo">Guion ${esc(g.origen)} · zona ${esc(g.zona || '—')} · anclado por ${esc(g.anclaje)}</div><h2><span class="mono">${esc(g.archivo)}</span></h2>
  <dl class="kv"><dt>REQ / origen</dt><dd>${g.req ? refId(g.req) : '—'}</dd><dt>Módulos</dt><dd>${g.modulos.map((m) => nodoRef(m)).join(' ')}</dd><dt>Perfiles</dt><dd>${Object.entries(g.perfiles).map(([k, v]) => `${k}×${v}`).join(', ')}</dd><dt>Niveles</dt><dd>${Object.entries(g.niveles).map(([k, v]) => `${k}×${v}`).join(', ')}</dd></dl>
  ${g.nota ? `<p class="nota">${esc(g.nota)}</p>` : ''}<h3>Casos (${g.nCasos})</h3>${g.casos.map((c) => `<div class="caso"><span class="mono">${esc(c.c || '')} · ${esc(c.perfil || '')}${c.camara ? ' · cámara' : ''} · ${esc(c.nivel || 'N2')} · ${esc((c.pagina || '').replace(/^\/|\.html$/g, ''))}</span><br>${esc(c.que)}${c.cubre && c.cubre.length ? `<br><span class="nota">cubre: ${c.cubre.map((x) => refId(x)).join(' ')}</span>` : ''}</div>`).join('')}
  <h3>Archivo</h3><p>${rutaDoc(g.origen === 'tests/e2e' ? 'tests/e2e/' + g.archivo : g.archivo)}</p>`;
}

// ---------- búsqueda ----------
const INDICE = [
  ...D.modulos.map((m) => ({id: m.id, t: 'módulo', n: m.nombre})),
  ...D.actores.map((a) => ({id: a.id, t: 'actor', n: a.nombre})),
  ...D.relaciones.map((r) => ({id: r.id, t: 'relación', n: `${r.origen} → ${r.destino} · ${r.mecanismo}`})),
  ...D.reglas.map((r) => ({id: r.id, t: 'regla', n: r.titulo})),
  ...D.infraestructura.map((e) => ({id: e.id, t: 'infra', n: e.nombre})),
  ...D.reqs.map((r) => ({id: r.id, t: 'REQ', n: `${r.titulo || ''} · ${r.estado}`})),
  ...D.guiones.map((g) => ({id: g.archivo, t: 'guion', n: `${g.req || ''} · ${g.modulos.join(' ')}`})),
];
const inp = $('#buscar'), sug = $('#sugerencias');
inp.addEventListener('input', () => {
  const q = inp.value.trim().toLowerCase();
  if (q.length < 2) { sug.hidden = true; return; }
  const hits = INDICE.filter((x) => (x.id + ' ' + x.n).toLowerCase().includes(q)).slice(0, 14);
  sug.innerHTML = hits.map((h) => `<button data-id="${esc(h.id)}"><span class="t">${h.t}</span><span class="mono">${esc(h.id)}</span><span class="nota">${esc(recortar(h.n, 70))}</span></button>`).join('') || '<div class="nota" style="padding:8px 10px">Sin resultados</div>';
  sug.hidden = false;
});
sug.addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { abrir(b.dataset.id); sug.hidden = true; inp.value = ''; } });
inp.addEventListener('keydown', (e) => { if (e.key === 'Escape') { sug.hidden = true; } if (e.key === 'Enter') { const b = sug.querySelector('button'); if (b) b.click(); } });
document.addEventListener('click', (e) => { if (!e.target.closest('.buscar')) sug.hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && sel) cerrar(); });
$('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { vista = b.dataset.v; render(); } });
document.addEventListener('click', (e) => { const a = e.target.closest('a.ref[href^="#"]'); if (a) { e.preventDefault(); abrir(a.getAttribute('href').slice(1)); } });
window.addEventListener('hashchange', () => { const h = decodeURIComponent(location.hash.slice(1)); if (h && h !== sel) abrir(h, false); });

$('#sub').textContent = `línea base ${D.lineaBase} · código ${D.codigo?.version} · esquema ${D.codigo?.schema} · generado ${D.generadoEn}`;
render();
const h0 = decodeURIComponent(location.hash.slice(1)); if (h0) abrir(h0, false);
</script>

ana, ventana de 2 h)", "str-manager-docs/producto/modulos/M1-housekeeping.md (portal del colaborador en el manual de producto)", "por-fuentes.json: módulo POR del mapa, 14 REQ, 23 DA, 4 de la bolsa, 21 INC, 2 DT, relaciones REL-05, REL-01, REL-02, REL-23 y REL-26, actores y reglas transversales (más REL-14, REL-15 y REL-31 del mapa por su mecanismo)", "por-guiones.json: 22 guiones e2e con casos por el portal; se leyeron los .spec.js de INC-126, INC-127, INC-131, INC-132, INC-140, INC-120-c12, INC-120-c3 y REQ-K3b / K3c para ver qué comprueba cada caso", "interno/linea-base/esquema.json, sistema.json, INV.json, HK.json y PR.json (estilo y flujos con ids reales)"], "revisiones": [{"fecha": "2026-10-18", "por": "Chat Diseño (M-806) y Chat Desarrollo (M-807)", "que": "Peso: esenciales 1, 2 y 5; necesarias 3, 4 y 7; accesorias 6 y 8. 8.1 fuera de alcance (T-24). Nuevos 2.4 y 2.5 (pares de CU-PR-3.5 y 4.6). INC-159 en 4.2; limitantes de 2.2 (reloj del teléfono) y 6.2 (vista previa escribe). 1.4 confirmado no construido."}], "alcance": {"dentro": ["Las listas de turnos del colaborador (Hoy, Atrasados, Próximos, Recientes) y la tarjeta de cada turno: estado, alertas, avance, esperas con cuenta regresiva, fotos, huésped, llegada y salida.", "Abrir un turno propio dentro del portal (desde su tarjeta, un aviso fijo o el enlace que le enviaron) y mantener la lista al día.", "Los avisos fijos de esperas en curso y de fotos que no se pudieron subir, sin tapar el pie del turno.", "«Mi dinero»: valor estimado, horas, saldo de horas y turnos del mes.", "Sesión y perfil: entrar, volver al inicio de sesión, salir, tipo de teléfono y tema.", "La vista previa del portal de un colaborador para el administrador y el operador.", "Lo que el portal recibe acotado a la operación del colaborador y su separación de la copia a Drive.", "Lo definido y aún por construir: calendario del colaborador con eventos de mantenimiento e inventario, vista de su sub-flujo, adelantos, compras y pagos recibidos, y «Mi desempeño»."], "fuera": ["La ejecución del turno (iniciar, marcar tareas, fotos, incidentes, cierre, entrega y recepción de zona, pendientes de ropa): es de Housekeeping; el portal la abre y la contiene.", "El cálculo de las horas y del valor del turno (Housekeeping) y la liquidación y el pago (Pagos): aquí solo se muestra el resultado.", "Lo que el servidor deja leer y escribir al colaborador (90 días, huésped de hoy o mañana, ventana de 2 horas): se cuenta en Housekeeping (CU-HK-11.x) y en Propiedades (CU-PR-8.3).", "Alta, invitación, roles y permisos del colaborador (Identidad) y el menú y el inicio de sesión (Shell).", "El horario y el plano de la propiedad en el portal: son casos de uso de Propiedades (CU-PR-3.5 y CU-PR-4.6).", "El informe para el propietario de terceros: no es un portal operativo."], "nota": "Borrador levantado por ingeniería inversa el 2026-10-18 desde el código del portal (621 líneas), su mapa técnico, los guiones e2e y las fuentes del módulo. En los REQ, «entregado» significa pasado a Desarrollo y no implica construido: lo construido se comprobó en el código. El peso de cada capacidad lo decide el dueño del producto (por-confirmar). El portal es un contenedor delgado: casi todo lo que el colaborador hace dentro del turno es de Housekeeping, y los guiones e2e que abren el portal son sobre todo de Housekeeping; aquí solo se citan los casos que ejercen algo propio del portal (listas, tarjeta, barra fija, «Mi dinero», sesión, límites con Drive). Los mismos casos de INC-126, INC-127, INC-131, INC-132 e INC-140 también respaldan casos de uso de Housekeeping. Los casos de uso de módulos vecinos sin línea base (Calendario CAL, Identidad U, Pagos PG) usan identificadores provisionales que su dueño debe confirmar; los flujos con Inventario, Housekeeping y Propiedades usan los ids reales. El estado calculado y la cobertura los calcula la herramienta."}, "capacidades": [{"id": "CAP-POR-1", "nombre": "Mis turnos", "tipo": "consulta", "peso": "e n en todos los turnos (DA-43); cierre de pendientes", "REL-11": "HK→SRV · el servidor sella `primerCierreAt` y crea `inv-pendientes` del circuito de la ropa", "REL-12": "INV→HK · tarea lavar/llevar + proveedor al siguiente turno", "REL-13": "PR→INV · zona con propIds, revocados", "REL-14": "U→HK · ids, nombres, colores, perfilPago, permisos (también a POR, PR, FL, INV)", "REL-15": "U→PG · saldo de horas del colaborador", "REL-16": "HK→K3 · fotos, evidencia, video → Drive; insignia ☁ por `drive/copias`", "REL-17": "K3→HK · borra binarios (también *.min.jpg); el registro conserva fecha, huella, corte y enlace; la app muestra el archivo desde Drive; /archivo y /expediente traen de Drive lo borrado o responden 410 (L-125).", "REL-18": "K3→SH · aviso fijo del próximo corte; recordatorios 7/3/1 días (admin y operador con config.drive)", "REL-19": "K3→INC1 · la evidencia borrada en el corte aparece como «Eliminado en el corte del <fecha>»", "REL-20": "HK→INC1 · ZIP con originales, SHA256SUMS, línea de tiempo; anota `ticket.expedientes[]`", "REL-21": "PR→airbnb · «No disponible (STR Manager)» + día de limpieza", "REL-22": "cron→CAL · reservas nuevas, canceladas, finalizadas; bloqueos de feed", "REL-23": "*→google-drive · identidad; renovación ante 401", "REL-24": "PRJ→github · seguimiento, diseño, mensajes, marco, instrucciones, cobit, elementos, conocimiento", "REL-25": "PRJ→MOD · tablas del modelo", "REL-26": "*→SRV · diff contra lastpush, cursor, tombstones explícitos", "REL-27": "SRV→U · permisos efectivos por rol y `usuario.permisos`", "REL-28": "cron→K3 · pasada de copia; corte solo en la ventana del día 30; deja fuera las cuentas zz-verif-restauracion- (L-131); también la cuenta zz-verif-pruebas (L-150).", "REL-29": "cola-arquitecto→MOD · carga completa del modelo por tabla", "REL-30": "HK→KN · la guía de la tarea se abre en el checklist", "REL-31": "CAL→INC1 · evento → turno del colaborador", "REL-32": "M2→CAL · datos del huésped por reserva (TRA/SIRE)", "REL-33": "OP→SRV · turnos, reservas, incidentes, pendientes, propiedades, flujos y usuarios mínimos en una respuesta", "REL-34": "OP→HK · avance esperado y real del turno en minutos, estado del tramo (al día, atrás, adelante, bloqueado)"}, "rt": {"RT-1": "Aislamiento por cuenta", "RT-2": "Datos reales: ni escribir ni borrar (R11)", "RT-3": "Los datos de prueba no salen del STR", "RT-4": "Un dato, una fuente", "RT-5": "No se borra, se desactiva o se anula", "RT-6": "Datos personales del huésped", "RT-7": "La hora del servidor manda", "RT-8": "Corte mensual único", "RT-9": "Drive es copia, no destino", "RT-10": "Evidencia de incidentes", "RT-11": "Fotos de tarea", "RT-12": "Respaldo antes de borrar", "RT-13": "Un usuario, un rol", "RT-14": "El servidor decide los permisos; el front solo oculta", "RT-15": "Todo participante operativo tiene cuenta", "RT-16": "Identidad = cuenta de Google (Firebase)", "RT-17": "Un solo responsable por turno", "RT-18": "Secretos solo en el servidor", "RT-19": "Hosting compartido: conexiones con cuidado", "RT-20": "Versionado y despliegue", "RT-21": "Colecciones /api/col/<col>", "RT-22": "Rutas programadas solo desde hPanel", "RT-23": "Crítico = DA-n + cruce con Carlos", "RT-24": "Verificación en producción solo con perfiles zz-verif-"}, "incs": {"INC-74": {"t": "Turnover, próximo huésped y hora de entrega no se recalculaban en turnos ya guardados", "e": "cerrado"}, "INC-75": {"t": "Logos de canal en la columna de propiedades no aparecían (comparación de clave en minúscula vs valor capitalizado)", "e": "cerrado"}, "INC-77": {"t": "Borrar un flujo que es flujo base de una propiedad no avisaba (hallado en lote 23); fix 26 (8bdabd4) verificado", "e": "cerrado"}, "INC-78": {"t": "Caché vieja del STR en otro navegador resubía datos de prueba al servidor (laptop de viaje, f-test-001); fix 29 (ac865c1): el servidor manda si conoce la colección y las migraciones al leer se suben tras el primer pull; verificado en producción", "e": "cerrado"}, "INC-79": {"t": "HK calcula 'hoy' en UTC (toISOString) en _alertasTurno y _renderSalidaHuesped: entre las 19:00 y las 24:00 de Bogotá 'hoy' es el día siguiente, y las alertas de salida y 'no iniciado' del día no se disparan; el Calendario usa la fecha local (_hoyStr). Hallado al verificar el lote 31; anterior a él. Barrido del cliente: solo otro caso, el nombre del respaldo del shell (incluido en el lote 32).", "e": "cerrado"}, "INC-80": {"t": "Lote 31: primer intento 21:56 falló sin commit porque la CLI del laptop agotó su límite de sesión ('resets 10:50pm'). Causa: cupo compartido con los chats. Carlos reencoló el mismo archivo y salió OK a las 23:16.", "e": "cerrado"}, "INC-81": {"t": "Servidor: api/sync-ical usa gmdate('Y-m-d') como 'hoy' (UTC). Entre las 19:00 y las 24:00 de Bogotá: una reserva con salida hoy pasa a 'finalizada' desde las 19:00 y no a medianoche, y una reserva con llegada hoy ausente del feed ya no se cancela. api/export nombra el respaldo diario con la fecha UTC (cosmético).", "e": "pospuesto"}, "INC-82": {"t": "Pestaña Cambios: los chips de estado 'registrado' y 'cerrado' no tienen color propio (texto casi blanco). Causa: el CSS del lote 27 solo define aceptado/no-aceptado/revertido y los lotes posteriores agregaron estados nuevos al JSON sin clase de color.", "e": "cerrado"}, "INC-83": {"t": "Editor de flujos: si una tarea tenía su propio 'mín.' de fotos y luego la actividad marca 📷, el mínimo de la tarea sigue vigente (_fbFotoEfectiva usa t.fotoMin || a.fotoMin) pero el editor oculta el input, así que queda activo e invisible.", "e": "cerrado"}, "INC-84": {"t": "api/export (respaldo JSON de la cuenta y respaldo diario) no incluía la colección 'guias': los respaldos anteriores al 7-oct no traen las guías. Causa: la colección se agregó a /api/col (REQ-K2) sin agregarla a $COLECCIONES de api/export (INC-73 no cubría export).", "e": "cerrado"}, "INC-85": {"t": "Lote 39 desplegado sin ninguna prueba de aceptación con el servidor real (a–e, g, f parcial): el PHP nuevo de /api/expediente nunca se ejecutó con datos. Causa: no existe un incidente con evidencias en producción y la lista de datos de prueba del verificador (6-oct) no le permitía crear tickets ni turnos.", "e": "cerrado"}, "INC-86": {"t": "GET /api/expediente/<id> responde 404 'Incidente no encontrado' para el único ticket existente (tk_mtwg32j0_4ncia, sin evidencias) con JWT admin y ?solo=html. Sin determinar si es esperado (ticket sin evidencias) o un fallo de la consulta a col_item.", "e": "cerrado"}, "INC-87": {"t": "El cambio de equipo de ASUS a LENOVO (6–7 oct) se volvió un día de arreglos: (1) LENOVO tenía la configuración del 23-sep (cola cada 15 min, sin lanzador oculto) porque los ajustes hechos en ASUS no volvieron a ins-005; (2) el Agente verificador queda atado al equipo donde se creó y hubo que recrearlo, y las ejecuciones lanzadas con mensaje caían a la nube; (3) el Chat de desarrollo perdió la escritura en str-manager-docs (403: el repo no está en las fuentes de su sesión) e improvisó copia en LENOVO, push manual de Carlos y subidas por la web, una de las cuales borró una entrada de cambios[].", "e": "cerrado"}, "INC-88": {"t": "HK, sub-fila de inventario: cuando la existencia esperada del apartamento es 0, el campo de unidad se pinta con value=\"\" en vez de 0; el valor interno sí es 0 y al marcar se registra un conteo 0 que el colaborador no vio. Causa: _hkInvRowHTML trata 0 como vacío al pintar.", "e": "cerrado"}, "INC-89": {"t": "HK no ofrece forma de borrar un turno manual desde la interfaz (ni el panel del turno ni la lista tienen acción de eliminar). La limpieza de turnos de prueba zz-verif- que exige el encargo del verificador no es posible por la interfaz; queda el turno sh-m-1791423653924 en zz-verif-Propiedad (7-oct 11:00–15:00, flujo extra ya borrado → referencia huérfana posible).", "e": "cerrado"}, "INC-90": {"t": "HK: tras 'Cerrar igual' con una foto pendiente, la línea de Limpieza del panel del turno muestra '🧹 aNaN' unos segundos y luego '🧹 22:35'. Causa probable: se formatea limpiezaCerradaEn.at antes de que el servidor estampe la hora (patrón conocido: formatear un at aún no resuelto).", "e": "cerrado"}, "INC-91": {"t": "Portal del colaborador: forzando _tkAnularModal/_tkConfirmarAnular, la interfaz muestra 'Anulada · motivo' y 'Evidencia anulada' aunque el servidor rechaza la anulación (anuladaEn sigue null). Causa: actualización optimista sin comprobar la respuesta y funciones invocables en modo colaborador aunque el botón no se pinte; el dato está protegido por el servidor.", "e": "cerrado"}, "INC-92": {"t": "Al marcar una tarea en un turno manual creado por admin y asignado a zz-verif-colab (titular), el portal muestra el toast rojo 'No puedes modificar un turno que no es tuyo', aunque la tarea queda marcada, el turno pasa a 'En curso' y los movimientos de inventario suben. Causa sin confirmar: el servidor rechaza alguna escritura del turno (probable hk:turnos) porque el turno manual no trae la asignación en el formato que valida INC-63.", "e": "cerrado"}, "INC-93": {"t": "STRApi.puede(clave) devuelve true para un operador mientras /api/me no se ha cargado (_meCache null → 'si no hay permisos, todo'). En el shell, antes de abrir un módulo, puede('inventario.editar') = true para zz-verif-oper sin el permiso; dentro del módulo, que carga /me, da false. El servidor sigue rechazando: solo afecta lo que la interfaz muestra.", "e": "cerrado"}, "INC-94": {"t": "GET /api/col/<colección> no filtra por rol: cualquier usuario del negocio, incluido el colaborador, recibe la colección completa (reservas con datos de huéspedes, turnos e incidentes de todas las propiedades). Leído en api/col/index.php (case 'GET': solo cuenta_id + colección) y observado en 45-veredicto: la copia local de turnos de zz-verif-colab trae turnos de otras propiedades (sh-ical, sh-r). La escritura sí está acotada (INC-63).", "e": "cerrado"}, "INC-95": {"t": "El Calendario dice 'una reserva no se elimina, se cancela' pero no ofrece cancelar una reserva directa; la reserva de prueba res-1791487807449 (zz-verif-Propiedad) y su turno quedaron activos.", "e": "cerrado"}, "INC-96": {"t": "Google bloqueaba el OAuth de STR Manager (403 access_denied): la app en modo prueba no tenía a la cuenta de Carlos como usuario de prueba.", "e": "cerrado"}, "INC-97": {"t": "Conectar Drive sin marcar la casilla de permiso de Google (desmarcada por defecto) vuelve con ?drive=error sin motivo; el callback no anota ultimo_error ni log en ninguna rama de error.", "e": "cerrado"}, "INC-98": {"t": "El colaborador no recibe invPrincipalId de la propiedad: si el admin elige a mano la zona principal, el colaborador cuenta en la automática y las existencias se parten.", "e": "cerrado"}, "INC-99": {"t": "El servidor envía al colaborador todas las zonas tipo principal, sin filtrar por propIds (latente: hoy ninguna ajena).", "e": "cerrado"}, "INC-100": {"t": "El log de la CLI del lote 53 no trae la lista explícita de archivos declarados vs tocados (sí el commit).", "e": "cerrado"}, "INC-101": {"t": "El respaldo diario (api/export) no incluye inv-grupos (y guias): su lista de colecciones se separó de la de /api/col.", "e": "cerrado"}, "INC-102": {"t": "Diagrama: cada flujo omitido deja 2 console.warn idénticos (la validación del mapa corre dos veces: contador y render). Además, la cabecera de la página cuenta '16 nodos (6 actores, 4 mecanismos, 5 lugares)' sin el tipo dato (anterior al lote 60).", "e": "cerrado"}, "INC-103": {"t": "Ficha de Propiedades: elegir la zona principal de inventario no se guarda hasta pulsar 'Guardar cambios' (sin aviso de cambios sin guardar).", "e": "cerrado"}, "INC-104": {"t": "Lote 62: el modo automático de la tarea 'Agente verificador' bloqueó la creación de datos zz-verif- en producción ([Modify Shared Resources]), aunque la lista cerrada de Carlos la autoriza; criterios 1–13 sin verificar.", "e": "cerrado"}, "INC-105": {"t": "Etapa actual y historial del ítem aceptado muestran horas distintas (16:53 y 16:50). La ficha toma la hora de «Etapa actual» de seguimiento.plan[].desde y la del evento «aceptado» de cambios[].aceptacion.horaBogota; son dos fuentes distintas que no se concilian. No es un error de código sino una diferencia de datos entre las dos fuentes.", "e": "abierto"}, "INC-106": {"t": "A 390 px las tablas del tablero siguen con varias columnas (scroll interno). El bloque TB1/TB2 reutiliza tablas de 760 px dentro de un contenedor overflow auto en vez de apilar filas; la página no se desplaza pero la instrucción §2.6 pide «una columna».", "e": "abierto"}, "INC-107": {"t": "El colaborador no recibe los préstamos que registró otra persona: el aviso de préstamos abiertos al cerrar su propio turno no le aparece (lectura de inv-movimientos del colaborador). El aviso sí funciona cuando cierra admin u operador.", "e": "abierto"}, "INC-108": {"t": "Un usuario tiene dos roles y un admin nuevo no puede entrar. zz-verif-admin ve 'No tienes una cuenta activa en STR Manager'.", "e": "cerrado"}, "INC-109": {"t": "El operador ve y abre el Dashboard (ocupación, reservas, turnos, tickets): el lote 67 lo debía ocultar.", "e": "cerrado"}, "INC-110": {"t": "Equipo muestra '✏️ Editar' al operador sin equipo.editar, también en filas admin.", "e": "abierto"}, "INC-111": {"t": "La barra superior muestra además el nombre de la cuenta de Google del perfil (#userName), no el del usuario del STR (visto con operador y con admin de prueba).", "e": "abierto"}, "INC-112": {"t": "Juego «incompleto»: la nota «está en …» es texto manual y queda vieja al trasladar el juego (visto: J1 seguía «en zz-verif-Apto» estando en zz-verif-Tendedero).", "e": "cerrado"}, "INC-113": {"t": "El modal «Cambiar» de «¿Dónde está la ropa?» muestra barra de desplazamiento horizontal en ventana de ~1800 px.", "e": "cerrado"}, "INC-114": {"t": "El chip «atrasado / crítico» del turno en el panel del Calendario no mira salidaConfirmada: una reserva con salida acordada 23:00 sale como atrasada a media mañana.", "e": "cerrado"}, "INC-115": {"t": "El detalle del turno muestra «→ Check-in … · 3:00 PM» y «La limpieza debe completarse antes de las 3:00 PM» aunque la ficha dice 15:30 y la reserva que entra tiene llegada acordada.", "e": "abierto"}, "INC-116": {"t": "Una reserva con salida hoy y salida acordada 23:00 aparece «Finalizada» en el panel del Calendario antes de esa hora.", "e": "abierto"}, "INC-117": {"t": "En un navegador sin datos guardados, str-propiedades.html sube al servidor propiedades y tipos de demostración antes de traer los reales.", "e": "cerrado"}, "INC-118": {"t": "Seg. Proyecto ordena los lotes «L-n» como 0: la pestaña Cambios los pone al final y «Producción» toma el último lote numérico (75) en vez de L-81.", "e": "cerrado"}, "INC-119": {"t": "La guardia del verificador local corta los GET de las páginas del grupo Proyecto a raw.githubusercontent.com (y cortará api.github.com): las pestañas que leen los JSON de str-manager-docs se prueban vacías.", "e": "cerrado"}, "INC-120": {"t": "El colaborador lee reservas, propiedades, tickets y otras colecciones de cualquier propiedad donde tuvo un turno, de cualquier fecha y también como apoyo, sin límite de tiempo.", "e": "cerrado"}, "INC-121": {"t": "Sin principal elegida a mano, _invPrincipalDe (copias de [INV-puras]) todavía puede escoger como principal automática una zona privada del propietario que sirva a la propiedad; contradice la decisión 6 (privada no entra en tareas ni conteos). Latente: hoy no hay zonas reales.", "e": "cerrado"}, "INC-122": {"t": "Si invPrincipalId apunta a una zona privada activa (dato viejo; L-86 ya impide guardarlo), _colZonaEscribible la sigue tomando como principal efectiva: rechaza la privada y también la principal pública que ahora elige el cliente (L-90), así que el conteo del colaborador sale rechazado. Latente: hoy no hay zonas reales.", "e": "pospuesto"}, "INC-123": {"t": "La ida y vuelta del modelo no es exacta en las filas normales: carga.php decodifica el paquete con json_decode(..., true) y guarda extra desde ese array, así que un {} dentro de extra se vuelve [] y un decimal entero 1.0 vuelve como 1 (testigo: seguimiento.json plan[90].orden 119.0 → 119 en el EXPORTAR de L-91).", "e": "cerrado"}, "INC-124": {"t": "Durante M4 de la migración, un secrets.php del Premium (app/modelo) se editó por error y el servicio del modelo quedó sin base un rato (db:false). La app del STR no se tocó.", "e": "cerrado"}, "INC-125": {"t": "Ventana «Lugares» a 390 px: tabla #subLista cortada (acciones fuera de vista) y palabras partidas a media palabra", "e": "cerrado"}, "INC-126": {"t": "Portal: el enlace ?turno= de un turno recién asignado dice «Ese turno no está asignado a ti» y no lo abre", "e": "cerrado"}, "INC-127": {"t": "HK: al abrir desde la lista en caché, el «portal:abrir» se pierde y el panel queda sin el turno (c–d del guion de L-101)", "e": "cerrado"}, "INC-128": {"t": "PUT de turnos e inv-movimientos del colaborador al marcar el conteo: 500 «Base de datos no disponible» (MySQL 2002)", "e": "abierto"}, "INC-129": {"t": "inv-articulos del colaborador trae artículos de zonas privada y revocada (REQ-INV2-7-1.spec.js f)", "e": "abierto"}, "INC-130": {"t": "La marca recién hecha de una tarea se pierde en pantalla si un pull de turnos pedido antes del clic llega después", "e": "cerrado"}, "INC-131": {"t": "En el portal, los diálogos de HK (Cerrar limpieza con nota, fotos pendientes, préstamos, omitir, guías, aviso de pendientes) quedan detrás del panel del turno", "e": "cerrado"}, "INC-132": {"t": "El aviso fijo «1 foto no se pudo subir → abrir turno» tapa los botones del pie del panel del turno y no deja cerrar el turno", "e": "cerrado"}, "INC-133": {"t": "Cola de subida: una foto agregada mientras se remata la anterior se sube antes de guardarse en el teléfono, se borra y queda «fallida» sin remedio", "e": "cerrado"}, "INC-134": {"t": "Shell: aviso «Sesión vencida · Entrar» con sesión iniciada (renueva antes de que Firebase recupere al usuario)", "e": "cerrado"}, "INC-135": {"t": "Drive: con invalid_grant se guarda solo «Google retiró el permiso» y se pierde el código y la descripción de Google", "e": "abierto"}, "INC-136": {"t": "Regresión: REQ-TB-3 g cuenta 2 consultas a la API en str-cobit.html (guion, no la página)", "e": "cerrado"}, "INC-137": {"t": "DT-42: el ensayo real de restauración da 500 en el INSERT de la cuenta de ensayo (restauracion.php:225, PDOException)", "e": "abierto"}, "INC-138": {"t": "Regresión: INC-132 g deja 1 foto en la cola (estaba «subiendo») y el aviso sigue (guion, no la página)", "e": "cerrado"}, "INC-139": {"t": "Lectura intermitente de los JSON del repo de documentos (API de GitHub) en páginas de Proyecto al final de una regresión larga", "e": "abierto"}, "INC-140": {"t": "El HK embebido en el portal navega a login.html cuando Firebase le da null al arrancar; login entra solo y vuelve: bucle que dispara el freno de INC-56 («varios inicios automáticos») desde el 3.º en 30 s", "e": "cerrado"}, "INC-141": {"t": "PUT /api/col/tickets solo valida el creadoPor entrante: con el id de un ticket ajeno, un colaborador puede leerlo completo en la respuesta o pisarlo", "e": "cerrado"}, "INC-142": {"t": "HK en modo colaborador: el aviso de huésped aún en la unidad crea el ticket con creadoPor «operador» y la autorresolución del checkout tardío edita tickets ajenos; los dos dan 403 y el 403 tumba el envío entero de tickets", "e": "abierto"}, "INC-143": {"t": "Guion REQ-INV2-3-4-hk: cerrarTurno espera 800 ms fijos tras cada botón y a veces «Cerrar turno» aún no está a la vista (g rojo con h y j en cascada en L-142)", "e": "abierto"}, "INC-144": {"t": "Guion REQ-INV2-4-1-interfaz caso d: en la regresión completa de L-142 contó 5 controles de edición en Zonas para el operador; aislado da 0", "e": "abierto"}, "INC-145": {"t": "Regresión completa: rojos intermitentes distintos en cada corrida de L-142, todos de sesión o permisos de colaborador/operador (entorno)", "e": "abierto"}, "INC-146": {"t": "Almacenamiento local del navegador lleno (QuotaExceededError en str-col-lastpush-v1) en los perfiles admin y oper de prueba: la regresión de L-145 cae en 23 casos", "e": "cerrado"}, "INC-147": {"t": "Regresión de L-146 cortada por caída de internet en LENOVO (net::ERR_INTERNET_DISCONNECTED en page.goto, 17:11–17:13); antes, puerta bloqueada por DNS (17:00)", "e": "cerrado"}, "INC-148": {"t": "Turnos zz-verif- de hoy que dejó la corrida de L-145 (limpiar() fallido con el almacenamiento lleno) rompen REQ-INV2-4-2, REQ-INV2-4-2-dif y REQ-OP-1 c en la reprueba de L-146", "e": "cerrado"}, "INC-149": {"t": "INC-131.spec.js b: page.goto de HK (admin) sin cargar en 45 s en la regresión de L-146 (18:15); c en cascada", "e": "cerrado"}, "INC-150": {"t": "Purga de prueba (L-147): las propiedades se reconocen solo por `nombre`, pero guardan el nombre en `name`; los turnos de zz-verif-Propiedad no cuentan como de prueba y 4517 movimientos zz se quedan («turno»)", "e": "cerrado"}, "INC-151": {"t": "Guion INC-146-purga d y e desfasados con la guardia de LM-53 (corta el POST sin confirmo y el del operador con un id ajeno antes del servidor: 409 en vez de 400/403)", "e": "cerrado"}, "INC-152": {"t": "REQ-MOD-6 g: apiRequestContext.get /api/health sin respuesta en 30 s (20:30) en la reprueba de L-145", "e": "abierto"}, "INC-153": {"t": "REQ-OP-1 d: el tablero del operador no pasa a 100 % tras marcar la última tarea desde HK (20:32, reprueba de L-145)", "e": "abierto"}, "INC-154": {"t": "REQ-INV2-4-1-interfaz: limpiar() solo desactiva las zonas zz-verif-L<n>-r-*; cada reprueba del mismo lote deja otra copia con el mismo nombre y el guion cae por strict mode (b) y en cascada (c)", "e": "cerrado"}, "INC-155": {"t": "Guion REQ-OP-1 c: con dos turnos «atrasado» lee el motivo «Sin empezar · debía empezar H (+N min)» como número (parseInt → NaN) y compara minutos contra el orden por % de atraso", "e": "cerrado"}, "INC-156": {"t": "L-150: _cpMover crea la cuenta « function diagramaSistema(){
  const ar = {};
  const sumar = (o, d) => { if (!o || !d || o === d) return; const k = o + '>' + d; ar[k] = (ar[k] || 0) + 1; };
  Object.values(CU).forEach(({mod, u}) => {
    (u.salidas || []).forEach((f) => sumar(mod, modDe(f.a)));
    (u.entradas || []).forEach((f) => { const o = modDe(f.de); if (!D.modulos[o]) sumar(o, mod); });
  });
  const nodos = [...new Set(Object.keys(ar).flatMap((k) => k.split('>')).concat(Object.keys(D.modulos)))];
  const lev = nodos.filter((n) => D.modulos[n]), otros = nodos.filter((n) => !D.modulos[n]);
  const W = 980, H = 440, cx = W / 2, cy = H / 2, pos = {};
  lev.forEach((n, i) => { const a = (i / Math.max(lev.length, 1)) * Math.PI * 2 - Math.PI / 2, r = lev.length > 1 ? 1 : 0; pos[n] = [cx + 110 * r * Math.cos(a), cy + 80 * r * Math.sin(a)]; });
  otros.forEach((n, i) => { const a = (i / Math.max(otros.length, 1)) * Math.PI * 2 - Math.PI / 2; pos[n] = [cx + 380 * Math.cos(a), cy + 175 * Math.sin(a)]; });
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Flujos entre módulos" style="min-width:720px"><defs><marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--acento)"/></marker></defs>`;
  Object.entries(ar).forEach(([k, n]) => { const [o, d] = k.split('>'); const [x1, y1] = pos[o], [x2, y2] = pos[d];
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ox = -dy / L * 6, oy = dx / L * 6;
    const k1 = Math.min(52 / Math.abs(dx / L || 1e-9), 22 / Math.abs(dy / L || 1e-9)), k2 = k1 + 4;
    s += `<line x1="${x1 + ox + dx / L * k1}" y1="${y1 + oy + dy / L * k1}" x2="${x2 + ox - dx / L * k2}" y2="${y2 + oy - dy / L * k2}" stroke="var(--acento)" stroke-opacity=".7" stroke-width="${Math.min(1 + n * .3, 6)}" marker-end="url(#fl)"><title>${o} → ${d}: ${n} flujo(s)</title></line>
      <text x="${(x1 + x2) / 2 + ox * 2.2}" y="${(y1 + y2) / 2 + oy * 2.2}" class="t2" text-anchor="middle">${n}</text>`; });
  nodos.forEach((n) => { const [x, y] = pos[n], l = !!D.modulos[n];
    s += `<g class="${l ? 'nodo' : ''}" data-m="${n}"><rect x="${x - 52}" y="${y - 22}" width="104" height="44" rx="8" fill="${l ? 'var(--acentof)' : 'var(--papel)'}" stroke="${l ? 'var(--acento)' : 'var(--noc)'}" ${l ? '' : 'stroke-dasharray="4 3"'}/>
      <text x="${x}" y="${y - 3}" text-anchor="middle" style="font-weight:700">${n}</text><text x="${x}" y="${y + 12}" text-anchor="middle" class="t2">${esc(corta(nMod(n), 16))}</text></g>`; });
  $('#dg').innerHTML = s + '</svg>';
  $$('#dg .nodo').forEach((g) => g.onclick = () => ir(g.dataset.m));
}

       <dt>Recibe de</dt><dd>${(u.entradas || []).map((f) => `${enlCU(f.de)} · ${esc(f.dato)}${relTxt(f.rel)}`).join('<br>') || nada}</dd>
       <dt>Entrega a</dt><dd>${(u.salidas || []).map((f) => `${enlCU(f.a)} · ${esc(f.dato)}${relTxt(f.rel)}`).join('<br>') || nada}</dd>
       <dt>Relaciones</dt><dd>${[...new Set([].concat(u.entradas || [], u.salidas || []).map((f) => f.rel).filter(Boolean))].map((r) => `${r} <span class="tenue">${esc(D.rel[r] || '')}</span>`).join('<br>') || nada}</dd>
       <dt>Pruebas</dt><dd>${(u.pruebas || []).map((p) => `<span class="dat">${esc(p.guion)}</span>${p.casos && p.casos.length ? ' · casos ' + esc(p.casos.join(', ')) : ''}${p.fiable === false ? ` <span class="tenue">· no fiable: ${esc(p.nota || '')}</span>` : ''}`).join('<br>') || nada}</dd>
       <dt>Técnica</dt><dd class="tenue">${esc([].concat(t.paginas || [], t.rutas || [], t.colecciones || []).join(' · ')) || '—'}${t.notas ? '<br>' + esc(t.notas) : ''}</dd>
     </dl></div></section>
   <section class="sec"><h2>Escenarios de prueba</h2>
     ${(u.escenarios || []).map((e) => `<div class="esc"><span class="k">${esc(e.id)} · ${esc(e.tipo).toUpperCase()}</span><span><b>Dado</b> ${esc(e.dado)}</span><span><b>Cuando</b> ${esc(e.cuando)}</span><span><b>Entonces</b> ${esc(e.entonces)}</span></div>`).join('') || '<span class="vacio">Sin escenarios.</span>'}</section>`;
  $$('#vista [data-ir]').forEach((b) => b.onclick = () => ir(b.dataset.ir));
  diagramaCU(id);
  window.scrollTo({top:0});
}
function diagramaCU(id){
  const {u} = CU[id];
  const ent = u.entradas || [], sal = u.salidas || [];
  const n = Math.max(ent.length, sal.length, 1), W = 980, H = Math.max(n * 62 + 40, 170), cy = H / 2;
  const yi = (i, k) => k <= 1 ? cy : 30 + i * ((H - 60) / (k - 1));
  const caja = (x, yy, cid, dato) => { const c = CU[cid], l = !!c;
    return `<g class="${l ? 'nodo' : ''}" data-ir="${cid}"><rect x="${x}" y="${yy - 24}" width="300" height="48" rx="6" fill="var(--hoja)" stroke="${l ? 'var(--linea)' : 'var(--noc)'}" ${l ? '' : 'stroke-dasharray="4 3"'}/>
      ${l ? `<rect x="${x}" y="${yy - 24}" width="5" height="48" fill="${COLOR_EST[est(cid)]}"/>` : ''}<text x="${x + 14}" y="${yy - 6}" class="t2">${esc(cid)}${l ? '' : ' · por levantar'}</text><text x="${x + 14}" y="${yy + 11}">${esc(corta(l ? c.u.que : dato, 42))}</text><title>${esc((l ? c.u.que : '') + ' · ' + (dato || ''))}</title></g>`; };
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Flujo de ${id}" style="min-width:760px"><defs><marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--acento)"/></marker></defs>`;
  if (!ent.length) s += `<text x="170" y="${cy + 4}" text-anchor="middle" class="t2">sin entradas de otros casos de uso</text>`;
  if (!sal.length) s += `<text x="${W - 170}" y="${cy + 4}" text-anchor="middle" class="t2">sin salidas a otros casos de uso</text>`;
  ent.forEach((f, i) => { const yy = yi(i, ent.length); s += `<path d="M320 ${yy} C 360 ${yy}, 360 ${cy}, 388 ${cy}" fill="none" stroke="var(--acento)" stroke-width="1.6" marker-end="url(#fa)"/><text x="350" y="${(yy + cy) / 2 - 4}" class="t2" text-anchor="middle">${esc(f.rel || '')}</text>` + caja(20, yy, f.de, f.dato); });
  sal.forEach((f, i) => { const yy = yi(i, sal.length); s += `<path d="M592 ${cy} C 620 ${cy}, 620 ${yy}, 658 ${yy}" fill="none" stroke="var(--acento)" stroke-width="1.6" marker-end="url(#fa)"/><text x="630" y="${(yy + cy) / 2 - 4}" class="t2" text-anchor="middle">${esc(f.rel || '')}</text>` + caja(660, yy, f.a, f.dato); });
  const q = String(u.que), l1 = q.slice(0, 28), l2 = corta(q.slice(28), 28);
  s += `<rect x="390" y="${cy - 36}" width="200" height="72" rx="8" fill="var(--acentof)" stroke="var(--acento)" stroke-width="2"/><text x="490" y="${cy - 14}" text-anchor="middle" class="t2">${esc(id)}</text>
    <text x="490" y="${cy + 4}" text-anchor="middle" style="font-weight:600">${esc(l1)}</text><text x="490" y="${cy + 20}" text-anchor="middle">${esc(l2)}</text>`;
  $('#dg').innerHTML = s + '</svg>';
  $$('#dg .nodo').forEach((g) => g.onclick = () => ir(g.dataset.ir));
}

/* ---------- Búsqueda global ---------- */
const IDX = Object.values(CU).map(({mod, u}) => ({id: u.id, mod, que: u.que, txt: (u.id + ' ' + u.que + ' ' + JSON.stringify([u.origen, u.pendientes, u.pruebas, u.limitantes, u.actor])).toLowerCase()}));
$('#buscar').oninput = () => {
  const q = $('#buscar').value.trim().toLowerCase();
  if (q.length < 2) { $('#sug').hidden = true; return; }
  const r = IDX.filter((x) => q.split(/\s+/).every((p) => x.txt.includes(p))).slice(0, 30);
  $('#sug').innerHTML = r.map((x) => `<button data-ir="${x.id}"><span class="dat">${x.id}</span> <span class="tenue">· ${x.mod}</span><br>${esc(x.que)}</button>`).join('') || '<div class="vacio" style="padding:10px 12px">Nada coincide.</div>';
  $('#sug').hidden = false;
  $$('#sug [data-ir]').forEach((b) => b.onclick = () => { $('#sug').hidden = true; $('#buscar').value = ''; ir(b.dataset.ir); });
};
document.addEventListener('click', (e) => { if (!e.target.closest('.busca')) $('#sug').hidden = true; });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#sug').hidden = true; });
if (D) pintar();
</script>
